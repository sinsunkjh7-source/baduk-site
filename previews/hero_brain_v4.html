<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바둑스쿨 · 히어로 시안 v4 (신경망 바둑판)</title>
<style>
  :root{
    --bg0:#06120E; --bg1:#0A1E17; --bg2:#0E2A1F;
    --ink:#EAF4EC; --dim:#93B7A2;
    --green:#7BD389; --wood:#F0C682;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1100px 680px at 74% 46%, rgba(70,170,110,.18), transparent 62%),
      radial-gradient(760px 520px at 8% 4%, rgba(240,198,130,.09), transparent 62%),
      linear-gradient(158deg, var(--bg0), var(--bg1) 46%, var(--bg2));
    color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    overflow:hidden;
  }
  .hero{position:relative;height:100vh;display:grid;
    grid-template-columns:minmax(420px,46%) 1fr;align-items:center;
    gap:20px;padding:0 clamp(28px,5vw,84px)}
  .copy{position:relative;z-index:2;max-width:560px}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;
    letter-spacing:.09em;color:var(--green);padding:7px 14px;border-radius:999px;
    border:1px solid rgba(123,211,137,.28);background:rgba(123,211,137,.07)}
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--green);
    box-shadow:0 0 12px var(--green);animation:bk 2.2s ease-in-out infinite}
  @keyframes bk{0%,100%{opacity:1}50%{opacity:.25}}
  h1{margin-top:22px;font-size:clamp(38px,4.3vw,60px);line-height:1.15;letter-spacing:-.032em;font-weight:900}
  h1 .accent{background:linear-gradient(100deg,#C4F6CE,#7BD389 42%,#F0C682);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:20px;font-size:clamp(15px,1.22vw,18.5px);line-height:1.75;color:var(--dim);font-weight:500}
  .sub b{color:#D9EFDF;font-weight:800}
  .cta{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:10px;height:58px;padding:0 30px;
    border-radius:999px;border:0;font-size:18px;font-weight:900;font-family:inherit;cursor:pointer;
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
  .btn:hover{transform:translateY(-2px)}
  .btn-primary{background:linear-gradient(180deg,#92E5A0,#58B96B);color:#052012;
    box-shadow:0 14px 34px rgba(88,185,107,.32),inset 0 1px 0 rgba(255,255,255,.5)}
  .btn-ghost{background:rgba(255,255,255,.055);color:var(--ink);
    border:1.5px solid rgba(180,225,195,.26);backdrop-filter:blur(6px)}
  .marks{display:flex;gap:26px;margin-top:38px;padding-top:24px;
    border-top:1px solid rgba(160,220,180,.14);flex-wrap:wrap}
  .mark b{display:block;font-size:18.5px;font-weight:900;color:#DEF2E3}
  .mark span{font-size:12.5px;color:#7FA994}
  canvas{width:100%;height:100%;display:block}
  .visual{position:relative;height:100%}
  @media (max-width:980px){
    body{overflow:auto}
    .hero{grid-template-columns:1fr;height:auto;padding:52px 22px 40px;gap:6px}
    .visual{order:-1;height:46vh}
    h1{font-size:33px}
    .btn{height:52px;padding:0 22px;font-size:16px}
  }
</style>
</head>
<body>
<section class="hero">
  <div class="copy">
    <span class="eyebrow"><i></i>바둑으로 자라는 생각</span>
    <h1>한 수 한 수,<br><span class="accent">두뇌가 자란다</span></h1>
    <p class="sub">
      바둑은 <b>계산</b>과 <b>직관</b>을 함께 쓰는 놀이입니다.
      아이는 수를 읽으며 집중력을, 형세를 보며 판단력을 키웁니다.
      <b>매일 20분</b>의 수읽기가 사고의 폭을 넓힙니다.
    </p>
    <div class="cta">
      <button class="btn btn-primary">▶ 바둑 시작하기</button>
      <button class="btn btn-ghost">▣ 바둑 배우기</button>
    </div>
    <div class="marks">
      <div class="mark"><b>집중력</b><span>한 수를 읽는 힘</span></div>
      <div class="mark"><b>판단력</b><span>형세를 보는 눈</span></div>
      <div class="mark"><b>인내심</b><span>끝까지 두는 마음</span></div>
    </div>
  </div>
  <div class="visual"><canvas id="net"></canvas></div>
</section>

<script>
(function () {
  var cv = document.getElementById('net');
  var ctx = cv.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, R = 0, cx = 0, cy = 0;

  var RINGS = 5, SPOKES = 12;
  var nodes = [], links = [], stones = [], pulses = [], T = 0;

  function build() {
    nodes = []; links = []; stones = []; pulses = [];
    cx = W * 0.5; cy = H * 0.5;
    R = Math.min(W * 0.42, H * 0.44);

    /* 노드: 링 × 스포크 교차점 (방사형 바둑판) */
    for (var r = 1; r <= RINGS; r++) {
      var rad = R * (r / RINGS) * 0.96 + R * 0.06;
      var count = r === 1 ? 1 : SPOKES;
      for (var k = 0; k < count; k++) {
        var a = (k / count) * Math.PI * 2 + (r % 2 ? 0.12 : 0);
        nodes.push({
          x: cx + Math.cos(a) * rad,
          y: cy + Math.sin(a) * rad,
          r: r, k: k, a: a,
          ph: Math.random() * 6.283
        });
      }
    }

    /* 연결: 같은 링 이웃 + 안쪽 링과 */
    var byRing = {};
    nodes.forEach(function (n) { (byRing[n.r] = byRing[n.r] || []).push(n); });

    Object.keys(byRing).forEach(function (rkey) {
      var ring = byRing[rkey];
      if (ring.length > 1) {
        for (var i = 0; i < ring.length; i++) {
          links.push({ a: ring[i], b: ring[(i + 1) % ring.length], kind: 'ring' });
        }
      }
      var inner = byRing[String(Number(rkey) - 1)];
      if (!inner) return;
      ring.forEach(function (n) {
        var best = null, bd = 1e9;
        inner.forEach(function (m) {
          var d = Math.hypot(n.x - m.x, n.y - m.y);
          if (d < bd) { bd = d; best = m; }
        });
        if (best) links.push({ a: n, b: best, kind: 'spoke' });
      });
    });

    /* 돌: 몇몇 노드에 흑/백 */
    nodes.forEach(function (n) {
      if (Math.random() < 0.18 && stones.length < 34) {
        stones.push({ n: n, black: stones.length % 2 === 0, t0: Math.random() * 6 });
      }
    });
  }

  function resize() {
    var b = cv.getBoundingClientRect();
    W = b.width; H = b.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  function draw(dt) {
    T += dt;
    ctx.clearRect(0, 0, W, H);
    if (!nodes.length) return;

    /* 중심 글로우 */
    var g0 = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.15);
    g0.addColorStop(0, 'rgba(123,211,137,.16)');
    g0.addColorStop(0.45, 'rgba(80,165,115,.07)');
    g0.addColorStop(1, 'rgba(6,20,14,0)');
    ctx.fillStyle = g0;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.15, 0, 6.283); ctx.fill();

    /* 링 */
    for (var r = 1; r <= RINGS; r++) {
      var rad = R * (r / RINGS) * 0.96 + R * 0.06;
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.283);
      ctx.lineWidth = r === RINGS ? 1.6 : 1;
      ctx.strokeStyle = 'rgba(160,225,180,' + (r === RINGS ? 0.34 : 0.16) + ')';
      ctx.stroke();
    }

    /* 스포크 */
    for (var k = 0; k < SPOKES; k++) {
      var a = (k / SPOKES) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * R * 0.1, cy + Math.sin(a) * R * 0.1);
      ctx.lineTo(cx + Math.cos(a) * R * 0.99, cy + Math.sin(a) * R * 0.99);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(160,225,180,.12)';
      ctx.stroke();
    }

    /* 연결선 (호흡) */
    links.forEach(function (l) {
      var k2 = 0.5 + 0.5 * Math.sin(T * 1.1 + l.a.ph);
      ctx.beginPath();
      ctx.moveTo(l.a.x, l.a.y);
      ctx.lineTo(l.b.x, l.b.y);
      ctx.lineWidth = l.kind === 'spoke' ? 0.8 : 1.1;
      ctx.strokeStyle = 'rgba(150,220,175,' + (0.06 + 0.10 * k2) + ')';
      ctx.stroke();
    });

    /* 신호: 링을 따라 흐르는 빛 + 중심에서 퍼짐 */
    if (Math.random() < 0.9) {
      var l = links[(Math.random() * links.length) | 0];
      pulses.push({ a: l.a, b: l.b, t: 0, sp: 0.7 + Math.random() * 0.8 });
      if (pulses.length > 46) pulses.shift();
    }
    for (var i = pulses.length - 1; i >= 0; i--) {
      var p = pulses[i];
      p.t += dt * p.sp;
      if (p.t >= 1) { pulses.splice(i, 1); continue; }
      var e = p.t * p.t * (3 - 2 * p.t);
      var x = p.a.x + (p.b.x - p.a.x) * e;
      var y = p.a.y + (p.b.y - p.a.y) * e;
      var al = Math.sin(Math.PI * p.t);

      ctx.beginPath();
      ctx.moveTo(p.a.x, p.a.y);
      ctx.lineTo(x, y);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(185,245,205,' + (0.30 * al) + ')';
      ctx.stroke();

      var g1 = ctx.createRadialGradient(x, y, 0, x, y, 14);
      g1.addColorStop(0, 'rgba(220,255,230,' + (0.95 * al) + ')');
      g1.addColorStop(0.35, 'rgba(123,211,137,' + (0.5 * al) + ')');
      g1.addColorStop(1, 'rgba(123,211,137,0)');
      ctx.fillStyle = g1;
      ctx.beginPath(); ctx.arc(x, y, 14, 0, 6.283); ctx.fill();
    }

    /* 노드 */
    nodes.forEach(function (n) {
      var k2 = 0.5 + 0.5 * Math.sin(T * 1.7 + n.ph);
      ctx.beginPath();
      ctx.arc(n.x, n.y, 1.6 + 0.8 * k2, 0, 6.283);
      ctx.fillStyle = 'rgba(190,240,205,' + (0.35 + 0.45 * k2) + ')';
      ctx.fill();
    });

    /* 돌 (나타나는 애니메이션) */
    var rr = Math.max(6, R * 0.035);
    stones.forEach(function (s) {
      var age = ((T + s.t0) % 8) / 8;
      var pop = age < 0.18 ? age / 0.18 : 1;
      var rad = rr * (0.6 + 0.4 * pop);
      var al = 0.35 + 0.65 * pop;
      ctx.beginPath(); ctx.arc(s.n.x, s.n.y, rad, 0, 6.283);
      if (s.black) {
        ctx.fillStyle = 'rgba(9,15,13,' + (0.92 * al) + ')';
        ctx.fill();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = 'rgba(205,240,215,' + (0.22 * al) + ')';
        ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(242,250,245,' + (0.9 * al) + ')';
        ctx.fill();
      }
    });

    /* 중심 코어 */
    var core = 0.5 + 0.5 * Math.sin(T * 2.2);
    var g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.16);
    g2.addColorStop(0, 'rgba(200,255,215,' + (0.5 + 0.3 * core) + ')');
    g2.addColorStop(0.5, 'rgba(123,211,137,' + (0.22 + 0.12 * core) + ')');
    g2.addColorStop(1, 'rgba(123,211,137,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.16, 0, 6.283); ctx.fill();

    /* 성장 링 (주기 확산) */
    var c = (T * 0.28) % 1;
    ctx.beginPath();
    ctx.arc(cx, cy, R * (0.12 + c * 0.95), 0, 6.283);
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = 'rgba(240,198,130,' + (0.20 * (1 - c)) + ')';
    ctx.stroke();
  }

  var last = performance.now();
  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    draw(dt);
    requestAnimationFrame(loop);
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
