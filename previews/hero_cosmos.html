<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바둑스쿨 · 히어로 모션 (두뇌 · 신경 · 우주)</title>
<style>
  :root{
    --space0:#04060F; --space1:#070C1C; --space2:#0A1226;
    --ink:#EFF7F4; --ink2:#AFC6BE; --dim:#7C998F;
    --mint:#8FE2A0; --mint2:#C9F5D6; --gold:#F2CB86;
    --hair:rgba(150,215,190,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:linear-gradient(160deg,var(--space0),var(--space1) 52%,var(--space2));
    color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .brand{position:absolute;top:30px;left:clamp(22px,5vw,84px);z-index:5}
  .brand img{height:38px;width:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}

  .hero{position:relative;min-height:100vh;display:grid;
    grid-template-columns:minmax(430px,44%) 1fr;align-items:center;
    padding:96px clamp(22px,5vw,84px) 64px}
  .copy{position:relative;z-index:3;max-width:548px}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:800;
    letter-spacing:.16em;text-transform:uppercase;color:var(--mint);
    padding:8px 15px;border-radius:999px;border:1px solid rgba(143,226,160,.22);
    background:rgba(143,226,160,.05)}
  .eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--mint);
    box-shadow:0 0 10px var(--mint);animation:bl 2.6s ease-in-out infinite}
  @keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}

  h1{margin-top:26px;font-size:clamp(40px,4.5vw,64px);line-height:1.13;
     letter-spacing:-.04em;font-weight:900;color:#F5FBF7}
  h1 .accent{display:block;margin-top:4px;
    background:linear-gradient(96deg,#DCFBE4,#8FE2A0 46%,#F2CB86);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:22px;font-size:clamp(15px,1.18vw,17.5px);line-height:1.8;
       color:var(--ink2);font-weight:450}
  .sub b{color:#E6F6EB;font-weight:800}
  .sub .hl{color:#D6F6DF;font-weight:800;border-bottom:1px solid rgba(143,226,160,.32);padding-bottom:1px}

  .cta{display:flex;gap:13px;margin-top:36px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:58px;
    padding:0 30px;border-radius:999px;border:0;cursor:pointer;font-family:inherit;
    font-size:17.5px;font-weight:900;letter-spacing:-.01em;
    transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s ease,background .18s ease}
  .btn:hover{transform:translateY(-2px)}
  .btn-primary{background:linear-gradient(180deg,#9DEBA9,#57BA6B);color:#04170E;
    box-shadow:0 16px 38px rgba(78,181,100,.3),inset 0 1px 0 rgba(255,255,255,.55)}
  .btn-ghost{background:rgba(255,255,255,.05);color:#E9F6ED;
    border:1.5px solid rgba(178,224,193,.2);backdrop-filter:blur(8px)}
  .btn:focus-visible{outline:2px solid var(--mint);outline-offset:3px}

  .marks{display:flex;margin-top:42px;padding-top:24px;border-top:1px solid var(--hair);flex-wrap:wrap}
  .mark{padding-right:28px;margin-right:28px;border-right:1px solid var(--hair)}
  .mark:last-child{border-right:0;margin-right:0;padding-right:0}
  .mark b{display:block;font-size:17.5px;font-weight:900;color:#E7F6EC;letter-spacing:-.02em}
  .mark span{display:block;margin-top:4px;font-size:12px;color:var(--dim)}

  .visual{position:relative;height:min(84vh,820px);min-height:440px}
  canvas{width:100%;height:100%;display:block}

  @media (max-width:1080px){
    .hero{grid-template-columns:1fr;padding:88px 24px 48px}
    .visual{order:-1;height:46vh;min-height:320px}
    .brand{top:20px;left:24px}
    h1{font-size:clamp(31px,7vw,42px)}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<div class="brand"><img src="../images/baduk_logo_final.png" alt="바둑스쿨"></div>

<section class="hero">
  <div class="copy">
    <span class="eyebrow"><i></i>바둑으로 자라는 생각</span>
    <h1>한 수 한 수,<span class="accent">생각이 깨어난다</span></h1>
    <p class="sub">
      바둑을 두는 동안 아이의 뇌에서는 <b>수천 개의 연결</b>이 만들어집니다.
      하나의 수가 다음 수를 부르고, 그 연결이 <b>생각의 우주</b>를 넓힙니다.
      <span class="hl">매일 20분</span>, 두뇌가 자라는 시간.
    </p>
    <div class="cta">
      <button class="btn btn-primary">▶ 바둑 시작하기</button>
      <button class="btn btn-ghost">▣ 바둑 배우기</button>
    </div>
    <div class="marks">
      <div class="mark"><b>집중력</b><span>한 수를 읽는 힘</span></div>
      <div class="mark"><b>판단력</b><span>형세를 보는 눈</span></div>
      <div class="mark"><b>인내심</b><span>끝까지 두는 마음</span></div>
    </div>
  </div>

  <div class="visual"><canvas id="c" aria-label="두뇌의 신경이 활성화되어 우주의 별과 연결되는 그래픽"></canvas></div>
</section>

<script>
(function () {
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, CX = 0, CY = 0, S = 0;
  var brain = null;

  var seed = 20261027;
  function rnd() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  function ease(a) { return a < 0 ? 0 : a > 1 ? 1 : a * a * (3 - 2 * a); }
  function clamp01(a) { return a < 0 ? 0 : a > 1 ? 1 : a; }

  var DUR = 36;

  var stars = [], neurons = [], synapses = [], tendrils = [], conj = [];

  /* ── 두뇌 윤곽 (정규화 좌표) ── */
  var OUTLINE = [
    [0.50,0.045],[0.61,0.045],[0.71,0.085],[0.79,0.155],[0.845,0.245],
    [0.865,0.335],[0.835,0.405],[0.875,0.475],[0.845,0.555],[0.79,0.615],
    [0.705,0.625],[0.665,0.705],[0.575,0.735],[0.53,0.815],[0.475,0.815],
    [0.455,0.725],[0.375,0.705],[0.295,0.665],[0.215,0.625],[0.16,0.545],
    [0.175,0.455],[0.135,0.375],[0.175,0.275],[0.235,0.165],[0.345,0.075],
    [0.425,0.045]
  ];

  function brainPath(sx, sy, s) {
    var p = new Path2D();
    var pts = OUTLINE.map(function (q) {
      return [sx + (q[0] - 0.5) * s * 1.55, sy + (q[1] - 0.5) * s];
    });
    p.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i <= pts.length; i++) {
      var a = pts[i - 1], b = pts[i % pts.length];
      var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      p.quadraticCurveTo(a[0], a[1], mx, my);
    }
    p.closePath();
    return p;
  }

  function build() {
    seed = 20261027;
    stars = []; neurons = []; synapses = []; tendrils = []; conj = [];

    CX = W * 0.60; CY = H * 0.50;
    S = Math.min(W * 0.62, H * 0.94);
    brain = brainPath(CX, CY, S);

    /* 별 */
    for (var i = 0; i < 260; i++) {
      stars.push({
        x: rnd() * W, y: rnd() * H,
        r: 0.5 + rnd() * 1.5,
        ph: rnd() * 6.283,
        sp: 0.3 + rnd() * 0.9,
        hue: rnd() < 0.22 ? 'gold' : 'cool'
      });
    }

    /* 뉴런: 두뇌 내부 점 */
    var tmp = document.createElement('canvas').getContext('2d');
    var tries = 0;
    while (neurons.length < 120 && tries < 6000) {
      tries++;
      var x = CX + (rnd() - 0.5) * S * 1.55;
      var y = CY + (rnd() - 0.5) * S;
      if (!tmp.isPointInPath(brain, x, y)) continue;
      neurons.push({ x: x, y: y, ph: rnd() * 6.283, d: 0, idx: neurons.length });
    }

    /* 시냅스: 가까운 2개 */
    neurons.forEach(function (n) {
      var near = neurons
        .filter(function (m) { return m !== n; })
        .map(function (m) { return { m: m, d: Math.hypot(m.x - n.x, m.y - n.y) }; })
        .sort(function (a, b) { return a.d - b.d; })
        .slice(0, 2);
      near.forEach(function (o) {
        if (o.d > S * 0.26) return;
        var key = Math.min(n.idx, o.m.idx) + '-' + Math.max(n.idx, o.m.idx);
        if (synapses.some(function (s) { return s.key === key; })) return;
        synapses.push({ a: n, b: o.m, key: key, ph: rnd() * 6.283 });
      });
    });

    /* 발화 순서: 중심에서 바깥으로 (BFS 거리 근사) */
    var core = neurons.reduce(function (best, n) {
      var d = Math.hypot(n.x - CX, n.y - CY);
      return (!best || d < best.d) ? { n: n, d: d } : best;
    }, null).n;
    neurons.forEach(function (n) {
      n.d = Math.hypot(n.x - core.x, n.y - core.y) / (S * 0.55);
      n.ignite = 6.0 + n.d * 7.0;
    });

    /* 외곽 뉴런 → 별 연결 (텐드릴) */
    var outer = neurons.slice().sort(function (a, b) { return b.d - a.d; }).slice(0, 18);
    outer.forEach(function (n, i) {
      var best = null, bd = 1e9;
      stars.forEach(function (st) {
        var d = Math.hypot(st.x - n.x, st.y - n.y);
        if (d < bd && d > S * 0.12) { bd = d; best = st; }
      });
      if (!best) return;
      tendrils.push({
        n: n, star: best,
        mx: (n.x + best.x) / 2 + (rnd() - 0.5) * S * 0.30,
        my: (n.y + best.y) / 2 + (rnd() - 0.5) * S * 0.30,
        t0: 13 + i * 0.55,
        dur: 2.4 + rnd() * 0.8
      });
    });

    /* 별자리: 텐드릴 끝 별끼리 가까운 쌍 */
    for (var a = 0; a < tendrils.length; a++) {
      for (var b = a + 1; b < tendrils.length; b++) {
        var p1 = tendrils[a].star, p2 = tendrils[b].star;
        if (Math.hypot(p1.x - p2.x, p1.y - p2.y) < S * 0.55) {
          conj.push({ a: p1, b: p2, t0: 24 + conj.length * 0.5 });
        }
      }
    }
  }

  function resize() {
    var b = cv.getBoundingClientRect();
    W = b.width; H = b.height;
    var dpr = 1;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function render(t) {
    ctx.clearRect(0, 0, W, H);
    if (!neurons.length) return;
    var tt = t % DUR;

    /* 배경 */
    /* 배경: 가장자리는 투명하게 (페이지 배경과 이음새 없이) */
    var bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.78);
    bg.addColorStop(0, 'rgba(26,60,54,.55)');
    bg.addColorStop(0.45, 'rgba(12,26,38,.35)');
    bg.addColorStop(1, 'rgba(4,6,15,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    /* 별 (반짝임) */
    stars.forEach(function (st) {
      var tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * st.sp + st.ph));
      var col = st.hue === 'gold' ? '242,203,134' : '198,226,255';
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r * (0.85 + 0.3 * tw), 0, 6.283);
      ctx.fillStyle = 'rgba(' + col + ',' + (0.25 + 0.55 * tw) + ')';
      ctx.fill();
    });

    /* 두뇌 윤곽 (그려지는 애니메이션) */
    var drawP = ease((tt - 0.6) / 4.2);
    if (drawP > 0) {
      ctx.save();
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = 'rgba(150,235,190,.5)';
      ctx.shadowColor = 'rgba(120,220,170,.55)';
      ctx.shadowBlur = 24;
      ctx.setLineDash([2400, 2400]);
      ctx.lineDashOffset = 2400 * (1 - drawP);
      ctx.stroke(brain);
      ctx.restore();
    }

    /* 두뇌 내부 은은한 빛 */
    var innerP = ease((tt - 3.6) / 5);
    if (innerP > 0) {
      ctx.save();
      ctx.clip(brain);
      var ig = ctx.createRadialGradient(CX, CY, 0, CX, CY, S * 0.55);
      ig.addColorStop(0, 'rgba(143,226,160,' + (0.13 * innerP) + ')');
      ig.addColorStop(0.6, 'rgba(90,170,140,' + (0.05 * innerP) + ')');
      ig.addColorStop(1, 'rgba(10,26,24,0)');
      ctx.fillStyle = ig;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    /* 시냅스 (활성된 것만) */
    synapses.forEach(function (s) {
      var on = Math.min(ease((tt - s.a.ignite) / 0.9), ease((tt - s.b.ignite) / 0.9));
      if (on <= 0) return;
      ctx.beginPath();
      ctx.moveTo(s.a.x, s.a.y);
      ctx.lineTo(s.b.x, s.b.y);
      ctx.lineWidth = 0.7 + 0.5 * on;
      ctx.strokeStyle = 'rgba(143,226,160,' + (0.10 + 0.22 * on) + ')';
      ctx.stroke();

      /* 신호 흐름 */
      var per = 2.8;
      var ph = ((t + s.ph) % per) / per;
      if (ph < 1 && on > 0.6) {
        var x = s.a.x + (s.b.x - s.a.x) * ph;
        var y = s.a.y + (s.b.y - s.a.y) * ph;
        var al = Math.sin(Math.PI * ph) * 0.9 * on;
        var g = ctx.createRadialGradient(x, y, 0, x, y, 7);
        g.addColorStop(0, 'rgba(225,255,235,' + al + ')');
        g.addColorStop(0.4, 'rgba(143,226,160,' + (0.45 * al) + ')');
        g.addColorStop(1, 'rgba(143,226,160,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, 7, 0, 6.283); ctx.fill();
      }
    });

    /* 뉴런 */
    neurons.forEach(function (n) {
      var on = ease((tt - n.ignite) / 0.8);
      var pulse = 0.5 + 0.5 * Math.sin(t * 1.6 + n.ph);
      var r = 1.4 + 1.0 * on + 0.5 * pulse * on;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, 6.283);
      ctx.fillStyle = 'rgba(200,245,215,' + (0.16 + 0.7 * on) + ')';
      ctx.fill();

      if (on > 0.55) {
        var g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 6);
        g.addColorStop(0, 'rgba(160,240,185,' + (0.22 * on) + ')');
        g.addColorStop(1, 'rgba(160,240,185,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(n.x, n.y, r * 6, 0, 6.283); ctx.fill();
      }
    });

    /* 텐드릴: 신경이 우주로 뻗음 */
    tendrils.forEach(function (td) {
      var p = ease((tt - td.t0) / td.dur);
      if (p <= 0) return;

      var steps = 24;
      var n = Math.max(2, Math.floor(steps * p));
      ctx.beginPath();
      ctx.moveTo(td.n.x, td.n.y);
      for (var i = 1; i <= n; i++) {
        var u = i / steps;
        var x = (1 - u) * (1 - u) * td.n.x + 2 * (1 - u) * u * td.mx + u * u * td.star.x;
        var y = (1 - u) * (1 - u) * td.n.y + 2 * (1 - u) * u * td.my + u * u * td.star.y;
        ctx.lineTo(x, y);
      }
      ctx.lineWidth = 1.1;
      ctx.strokeStyle = 'rgba(160,235,190,' + (0.30 * p) + ')';
      ctx.stroke();

      /* 도달 시 별이 밝아짐 */
      if (p > 0.98) {
        var k = ease((tt - td.t0 - td.dur) / 1.2);
        var g = ctx.createRadialGradient(td.star.x, td.star.y, 0, td.star.x, td.star.y, 26 * (0.4 + k));
        g.addColorStop(0, 'rgba(255,240,205,' + (0.55 * k) + ')');
        g.addColorStop(0.35, 'rgba(242,203,134,' + (0.30 * k) + ')');
        g.addColorStop(1, 'rgba(242,203,134,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(td.star.x, td.star.y, 26 * (0.4 + k), 0, 6.283); ctx.fill();

        ctx.beginPath();
        ctx.arc(td.star.x, td.star.y, 2 + 1.6 * k, 0, 6.283);
        ctx.fillStyle = 'rgba(255,248,225,' + (0.85 * k) + ')';
        ctx.fill();
      }
    });

    /* 별자리 연결 */
    conj.forEach(function (c) {
      var p = ease((tt - c.t0) / 2.0);
      if (p <= 0) return;
      ctx.beginPath();
      ctx.moveTo(c.a.x, c.a.y);
      ctx.lineTo(c.a.x + (c.b.x - c.a.x) * p, c.a.y + (c.b.y - c.a.y) * p);
      ctx.lineWidth = 0.8;
      ctx.strokeStyle = 'rgba(242,203,134,' + (0.22 * p) + ')';
      ctx.stroke();
    });

    /* 비네트 */
    var vg = ctx.createRadialGradient(CX, CY, S * 0.30, CX, CY, Math.max(W, H) * 0.80);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(2,4,10,.38)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  var mt = /[?&]t=([0-9.]+)/.exec(location.search);
  resize();

  if (mt) {
    var target = parseFloat(mt[1]);
    requestAnimationFrame(function () {
      resize();
      (function hold() { render(target); requestAnimationFrame(hold); })();
      document.title = 'F|t=' + target + '|W=' + Math.round(W) + '|n=' + neurons.length;
    });
  } else {
    var t0 = performance.now();
    (function loop(now) { render((now - t0) / 1000); requestAnimationFrame(loop); })(t0);
  }

  window.addEventListener('resize', function () { resize(); if (mt) render(parseFloat(mt[1])); });
})();
</script>
</body>
</html>
