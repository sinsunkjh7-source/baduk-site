<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바둑스쿨 · 히어로 완성형 시안</title>
<style>
  :root{
    --bg0:#050F0B; --bg1:#081A13; --bg2:#0C2419;
    --ink:#EFF7F1; --ink2:#B6CFC0; --dim:#84A794;
    --green:#7BD389; --green-deep:#4FA362; --wood:#F0C682;
    --hair:rgba(150,215,175,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 760px at 76% 44%, rgba(66,168,110,.20), transparent 64%),
      radial-gradient(900px 620px at 6% 2%, rgba(240,198,130,.08), transparent 60%),
      linear-gradient(158deg, var(--bg0), var(--bg1) 46%, var(--bg2));
    color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ── 상단 브랜드 ── */
  .brand{
    position:absolute; top:28px; left:clamp(22px,5vw,84px);
    display:flex; align-items:center; gap:11px; z-index:5;
  }
  .brand img{height:38px;width:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
  .brand span{font-size:15px;font-weight:800;letter-spacing:-.01em;color:#DCEFE2;opacity:.92}

  .hero{
    position:relative; min-height:100vh; display:grid;
    grid-template-columns:minmax(430px,46%) 1fr;
    align-items:center; gap:16px;
    padding:96px clamp(22px,5vw,84px) 64px;
  }

  /* ── 카피 ── */
  .copy{position:relative;z-index:3;max-width:566px}
  .eyebrow{
    display:inline-flex;align-items:center;gap:9px;
    font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--green);padding:8px 15px;border-radius:999px;
    border:1px solid rgba(123,211,137,.26);background:rgba(123,211,137,.06);
  }
  .eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--green);
    box-shadow:0 0 10px var(--green);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.8)}}

  h1{margin-top:24px;font-size:clamp(40px,4.6vw,66px);line-height:1.12;
     letter-spacing:-.038em;font-weight:900;color:#F3FBF5}
  h1 .line2{display:block;margin-top:2px}
  h1 .accent{
    background:linear-gradient(96deg,#D2F8DA 0%,#7BD389 46%,#F0C682 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  .sub{margin-top:22px;font-size:clamp(15px,1.2vw,18px);line-height:1.78;
       color:var(--ink2);font-weight:450;letter-spacing:-.005em}
  .sub b{color:#E4F4E9;font-weight:800}
  .sub .hl{color:#CDEFD6;font-weight:800;border-bottom:1px solid rgba(123,211,137,.4);padding-bottom:1px}

  .cta{display:flex;align-items:center;gap:13px;margin-top:36px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
       height:58px;padding:0 30px;border-radius:999px;border:0;cursor:pointer;
       font-family:inherit;font-size:17.5px;font-weight:900;letter-spacing:-.01em;
       transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease, background .18s ease;
       will-change:transform}
  .btn:active{transform:translateY(0) scale(.985)}
  .btn-primary{
    background:linear-gradient(180deg,#97E7A4,#57BA6B);color:#04170E;
    box-shadow:0 16px 38px rgba(78,181,100,.34), inset 0 1px 0 rgba(255,255,255,.55);
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 22px 46px rgba(78,181,100,.46)}
  .btn-ghost{
    background:rgba(255,255,255,.055);color:#E9F6ED;
    border:1.5px solid rgba(178,224,193,.24);backdrop-filter:blur(8px);
  }
  .btn-ghost:hover{transform:translateY(-2px);background:rgba(255,255,255,.1)}
  .btn:focus-visible{outline:2px solid var(--green);outline-offset:3px}

  .marks{display:flex;gap:0;margin-top:42px;flex-wrap:wrap;
         border-top:1px solid var(--hair);padding-top:24px}
  .mark{padding-right:30px;margin-right:30px;border-right:1px solid var(--hair)}
  .mark:last-child{border-right:0;margin-right:0;padding-right:0}
  .mark b{display:block;font-size:18px;font-weight:900;color:#E6F5EB;letter-spacing:-.02em}
  .mark span{display:block;margin-top:4px;font-size:12.5px;color:var(--dim);letter-spacing:.01em}

  /* ── 비주얼 ── */
  .visual{position:relative;height:min(78vh,760px);min-height:440px}
  canvas{width:100%;height:100%;display:block}
  .visual .halo{
    position:absolute;inset:8% 6% 10% 10%;border-radius:50%;
    background:radial-gradient(circle,rgba(123,211,137,.14),transparent 68%);
    filter:blur(38px);pointer-events:none;
  }
  .badge{
    position:absolute;right:clamp(18px,4vw,54px);bottom:34px;
    display:flex;align-items:center;gap:10px;
    padding:11px 17px;border-radius:999px;
    background:rgba(9,26,19,.55);border:1px solid rgba(160,220,180,.18);
    backdrop-filter:blur(10px);font-size:13px;color:#C9E6D3;font-weight:700;
  }
  .badge b{color:var(--green);font-weight:900}

  @media (max-width:1080px){
    .hero{grid-template-columns:1fr;min-height:auto;padding:88px 24px 48px;gap:10px}
    .visual{order:-1;height:44vh;min-height:320px}
    .brand{top:20px;left:24px}
    h1{font-size:clamp(32px,7.4vw,44px)}
    .marks{gap:0;margin-top:32px}
    .mark{padding-right:20px;margin-right:20px}
    .badge{right:16px;bottom:14px;font-size:12px;padding:9px 14px}
  }
  @media (max-width:560px){
    .btn{height:52px;padding:0 22px;font-size:16px;flex:1;min-width:150px}
    .mark b{font-size:16px}
    .mark span{font-size:11.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<div class="brand">
  <img src="../images/baduk_logo_final.png" alt="">
</div>

<section class="hero">
  <div class="copy">
    <span class="eyebrow"><i></i>바둑으로 자라는 생각</span>

    <h1>
      한 수 한 수,
      <span class="line2"><span class="accent">두뇌가 자란다</span></span>
    </h1>

    <p class="sub">
      바둑은 <b>계산</b>과 <b>직관</b>을 함께 쓰는 놀이입니다.
      아이는 수를 읽으며 집중력을, 형세를 보며 판단력을 키웁니다.
      <span class="hl">매일 20분</span>의 수읽기가 사고의 폭을 넓힙니다.
    </p>

    <div class="cta">
      <button class="btn btn-primary">▶ 바둑 시작하기</button>
      <button class="btn btn-ghost">▣ 바둑 배우기</button>
    </div>

    <div class="marks">
      <div class="mark"><b>집중력</b><span>한 수를 읽는 힘</span></div>
      <div class="mark"><b>판단력</b><span>형세를 보는 눈</span></div>
      <div class="mark"><b>인내심</b><span>끝까지 두는 마음</span></div>
    </div>
  </div>

  <div class="visual">
    <div class="halo"></div>
    <canvas id="net" aria-label="바둑돌이 연결되어 성장하는 신경망 그래픽"></canvas>
  </div>
</section>

<div class="badge"><b>20분</b> 하루 수읽기 · 집중력 훈련</div>

<script>
(function () {
  var cv = document.getElementById('net');
  var ctx = cv.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, R = 0, cx = 0, cy = 0;
  var RINGS = 5, SPOKES = 12;

  var nodes = [], links = [], stones = [], pulses = [], T = 0;
  var LABELS = [];
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function build() {
    nodes = []; links = []; stones = []; pulses = []; LABELS = [];
    cx = W * 0.5; cy = H * 0.5;
    R = Math.min(W * 0.43, H * 0.45);

    for (var r = 1; r <= RINGS; r++) {
      var rad = R * (r / RINGS) * 0.95 + R * 0.07;
      var count = r === 1 ? 1 : SPOKES;
      for (var k = 0; k < count; k++) {
        var a = (k / count) * Math.PI * 2 + (r % 2 ? 0.13 : 0);
        nodes.push({ x: cx + Math.cos(a) * rad, y: cy + Math.sin(a) * rad, r: r, a: a, ph: Math.random() * 6.283 });
      }
    }

    var byRing = {};
    nodes.forEach(function (n) { (byRing[n.r] = byRing[n.r] || []).push(n); });
    Object.keys(byRing).forEach(function (rk) {
      var ring = byRing[rk];
      if (ring.length > 1) {
        for (var i = 0; i < ring.length; i++) links.push({ a: ring[i], b: ring[(i + 1) % ring.length], k: 'ring' });
      }
      var inner = byRing[String(Number(rk) - 1)];
      if (!inner) return;
      ring.forEach(function (n) {
        var best = null, bd = 1e9;
        inner.forEach(function (m) {
          var d = Math.hypot(n.x - m.x, n.y - m.y);
          if (d < bd) { bd = d; best = m; }
        });
        if (best) links.push({ a: n, b: best, k: 'spoke' });
      });
    });

    nodes.forEach(function (n) {
      if (Math.random() < 0.30 && stones.length < 46) {
        stones.push({ n: n, black: stones.length % 2 === 0, t0: Math.random() * 6 });
      }
    });

    /* 주석 라벨 (넓은 화면에서만) */
    if (W > 720) {
      var picks = [
        { text: '형세 판단' },
        { text: '집중력' },
        { text: '계산' }
      ];
      /* 왼쪽 호에 라벨을 두고 왼쪽으로 뻗는다 (오른쪽 잘림 방지) */
      var leftArc = nodes.filter(function (n) {
        return n.r >= 4 && n.x < cx - R * 0.40;
      }).sort(function (a, b) { return a.y - b.y; });

      if (leftArc.length >= 3) {
        var idxs = [Math.round(leftArc.length * 0.15), Math.round(leftArc.length * 0.5), Math.round(leftArc.length * 0.85)];
        idxs.forEach(function (k, i) {
          if (leftArc[k]) LABELS.push({ n: leftArc[k], text: picks[i].text, side: -1 });
        });
      }
    }
  }

  function resize() {
    var b = cv.getBoundingClientRect();
    W = b.width; H = b.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  function draw(dt) {
    T += dt;
    ctx.clearRect(0, 0, W, H);
    if (!nodes.length) return;

    var g0 = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.2);
    g0.addColorStop(0, 'rgba(123,211,137,.17)');
    g0.addColorStop(0.42, 'rgba(76,160,110,.07)');
    g0.addColorStop(1, 'rgba(5,18,12,0)');
    ctx.fillStyle = g0;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.2, 0, 6.283); ctx.fill();

    for (var r = 1; r <= RINGS; r++) {
      var rad = R * (r / RINGS) * 0.95 + R * 0.07;
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.283);
      ctx.lineWidth = r === RINGS ? 1.5 : 1;
      ctx.strokeStyle = 'rgba(160,225,180,' + (r === RINGS ? 0.30 : 0.14) + ')';
      ctx.stroke();
    }

    for (var k = 0; k < SPOKES; k++) {
      var a = (k / SPOKES) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * R * 0.11, cy + Math.sin(a) * R * 0.11);
      ctx.lineTo(cx + Math.cos(a) * R * 0.98, cy + Math.sin(a) * R * 0.98);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(160,225,180,.10)';
      ctx.stroke();
    }

    links.forEach(function (l) {
      var kk = 0.5 + 0.5 * Math.sin(T * 1.05 + l.a.ph);
      ctx.beginPath();
      ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y);
      ctx.lineWidth = l.k === 'spoke' ? 0.8 : 1;
      ctx.strokeStyle = 'rgba(150,220,175,' + (0.05 + 0.09 * kk) + ')';
      ctx.stroke();
    });

    /* 돌 사이 곡선 다발 */
    for (var si = 0; si < stones.length; si++) {
      for (var sj = si + 1; sj < stones.length; sj++) {
        var A = stones[si].n, B = stones[sj].n;
        var d = Math.hypot(A.x - B.x, A.y - B.y);
        if (d > R * 0.40 || d < R * 0.11) continue;
        var mx = (A.x + B.x) / 2 + (B.y - A.y) * 0.15;
        var my = (A.y + B.y) / 2 - (B.x - A.x) * 0.15;
        var kk2 = 0.5 + 0.5 * Math.sin(T * 0.85 + si + sj);
        ctx.beginPath();
        ctx.moveTo(A.x, A.y);
        ctx.quadraticCurveTo(mx, my, B.x, B.y);
        ctx.lineWidth = 0.85 + 0.55 * kk2;
        ctx.strokeStyle = 'rgba(150,235,180,' + (0.05 + 0.10 * kk2) + ')';
        ctx.stroke();
      }
    }

    if (!reduced && Math.random() < 0.9) {
      var l = links[(Math.random() * links.length) | 0];
      pulses.push({ a: l.a, b: l.b, t: 0, sp: 0.7 + Math.random() * 0.75 });
      if (pulses.length > 46) pulses.shift();
    }
    for (var i = pulses.length - 1; i >= 0; i--) {
      var p = pulses[i];
      p.t += dt * p.sp;
      if (p.t >= 1) { pulses.splice(i, 1); continue; }
      var e = p.t * p.t * (3 - 2 * p.t);
      var x = p.a.x + (p.b.x - p.a.x) * e;
      var y = p.a.y + (p.b.y - p.a.y) * e;
      var al = Math.sin(Math.PI * p.t);

      ctx.beginPath();
      ctx.moveTo(p.a.x, p.a.y); ctx.lineTo(x, y);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(186,245,206,' + (0.30 * al) + ')';
      ctx.stroke();

      var g1 = ctx.createRadialGradient(x, y, 0, x, y, 15);
      g1.addColorStop(0, 'rgba(224,255,232,' + (0.95 * al) + ')');
      g1.addColorStop(0.34, 'rgba(123,211,137,' + (0.5 * al) + ')');
      g1.addColorStop(1, 'rgba(123,211,137,0)');
      ctx.fillStyle = g1;
      ctx.beginPath(); ctx.arc(x, y, 15, 0, 6.283); ctx.fill();
    }

    nodes.forEach(function (n) {
      var kk = 0.5 + 0.5 * Math.sin(T * 1.65 + n.ph);
      ctx.beginPath();
      ctx.arc(n.x, n.y, 1.5 + 0.7 * kk, 0, 6.283);
      ctx.fillStyle = 'rgba(190,240,205,' + (0.32 + 0.42 * kk) + ')';
      ctx.fill();
    });

    var rr = Math.max(6, R * 0.036);
    stones.forEach(function (s) {
      var age = ((T + s.t0) % 8) / 8;
      var pop = age < 0.16 ? age / 0.16 : 1;
      var rad = rr * (0.66 + 0.34 * pop);
      var al2 = 0.4 + 0.6 * pop;
      ctx.beginPath(); ctx.arc(s.n.x, s.n.y, rad, 0, 6.283);
      if (s.black) {
        ctx.fillStyle = 'rgba(8,14,12,' + (0.94 * al2) + ')'; ctx.fill();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = 'rgba(205,240,215,' + (0.24 * al2) + ')'; ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(244,251,246,' + (0.92 * al2) + ')'; ctx.fill();
      }
    });

    var core = 0.5 + 0.5 * Math.sin(T * 2.1);
    var g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.17);
    g2.addColorStop(0, 'rgba(205,255,218,' + (0.48 + 0.28 * core) + ')');
    g2.addColorStop(0.5, 'rgba(123,211,137,' + (0.20 + 0.12 * core) + ')');
    g2.addColorStop(1, 'rgba(123,211,137,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.17, 0, 6.283); ctx.fill();

    var c = (T * 0.28) % 1;
    ctx.beginPath();
    ctx.arc(cx, cy, R * (0.13 + c * 0.94), 0, 6.283);
    ctx.lineWidth = 1.3;
    ctx.strokeStyle = 'rgba(240,198,130,' + (0.18 * (1 - c)) + ')';
    ctx.stroke();

    /* 라벨 */
    if (LABELS.length) {
      ctx.font = '800 13.5px "Pretendard","Malgun Gothic",sans-serif';
      ctx.textBaseline = 'middle';
      LABELS.forEach(function (L) {
        var x = L.n.x + L.side * (R * 0.10);
        var y = L.n.y - R * 0.055;
        var tw = ctx.measureText(L.text).width;
        ctx.strokeStyle = 'rgba(170,235,190,.55)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(L.n.x, L.n.y);
        ctx.lineTo(x - (L.side > 0 ? 0 : tw + 10), y);
        ctx.stroke();

        var bx = L.side > 0 ? x : x - tw - 18;
        if (bx < 10) bx = 10;
        if (bx + tw + 20 > W - 10) bx = W - 10 - tw - 20;
        if (bx < 10) bx = 10;
        if (bx + tw + 20 > W - 10) bx = W - 10 - tw - 20;
        ctx.fillStyle = 'rgba(6,20,14,.85)';
        ctx.strokeStyle = 'rgba(150,220,175,.22)';
        ctx.lineWidth = 1;
        roundRect(bx, y - 13, tw + 20, 26, 13);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = 'rgba(224,246,232,.98)';
        ctx.fillText(L.text, bx + 9, y);
      });
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var last = performance.now();
  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    draw(dt);
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  if (reduced) { draw(0); } else { requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
