<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바둑스쿨 · 히어로 시안 (두뇌 성장)</title>
<style>
  :root{
    --bg0:#07130F; --bg1:#0C2118; --bg2:#123024;
    --ink:#EAF4EC; --ink-dim:#9DBCA8;
    --green:#7BD389; --green-deep:#3E8B4E; --wood:#F2C87A;
    --line:rgba(160,220,180,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 78% 42%, rgba(70,170,110,.20), transparent 62%),
      radial-gradient(900px 600px at 12% 8%, rgba(242,200,122,.10), transparent 60%),
      linear-gradient(160deg, var(--bg0) 0%, var(--bg1) 48%, var(--bg2) 100%);
    color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    overflow:hidden;
  }
  /* 배경 격자 */
  .grid{
    position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(120% 90% at 50% 40%, #000 30%, transparent 78%);
    -webkit-mask-image:radial-gradient(120% 90% at 50% 40%, #000 30%, transparent 78%);
  }

  .hero{
    position:relative; height:100vh; display:grid;
    grid-template-columns:minmax(420px, 46%) 1fr;
    align-items:center; gap:24px; padding:0 clamp(28px,5vw,88px);
  }

  /* ── 왼쪽 카피 ── */
  .copy{position:relative; z-index:2; max-width:560px}
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:13.5px; font-weight:700; letter-spacing:.08em;
    color:var(--green);
    padding:7px 14px; border-radius:999px;
    border:1px solid rgba(123,211,137,.28);
    background:rgba(123,211,137,.07);
  }
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--green);
    box-shadow:0 0 12px var(--green); animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  h1{
    margin-top:22px;
    font-size:clamp(38px,4.4vw,62px); line-height:1.14; letter-spacing:-.03em; font-weight:900;
  }
  h1 .accent{
    background:linear-gradient(100deg,#B9F2C4 0%,#7BD389 40%,#F2C87A 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{
    margin-top:20px; font-size:clamp(15px,1.25vw,19px); line-height:1.72;
    color:var(--ink-dim); font-weight:500;
  }
  .sub b{color:#D8EEDD; font-weight:800}

  .cta{display:flex; align-items:center; gap:14px; margin-top:34px; flex-wrap:wrap}
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    height:58px; padding:0 30px; border-radius:999px; border:0;
    font-size:18px; font-weight:900; font-family:inherit; cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn-primary{
    background:linear-gradient(180deg,#8FE39C,#59B96C); color:#062314;
    box-shadow:0 14px 34px rgba(89,185,108,.32), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .btn-primary:hover{box-shadow:0 18px 40px rgba(89,185,108,.42)}
  .btn-ghost{
    background:rgba(255,255,255,.055); color:var(--ink);
    border:1.5px solid rgba(180,225,195,.26); backdrop-filter:blur(6px);
  }
  .btn-ghost:hover{background:rgba(255,255,255,.1)}

  .marks{display:flex; gap:26px; margin-top:38px; padding-top:26px;
    border-top:1px solid rgba(160,220,180,.14); flex-wrap:wrap}
  .mark{display:flex; flex-direction:column; gap:4px}
  .mark b{font-size:19px; font-weight:900; color:#DFF3E3; letter-spacing:-.01em}
  .mark span{font-size:12.5px; color:#83A992; letter-spacing:.02em}

  /* ── 오른쪽 모션 그래픽 ── */
  .visual{position:relative; height:100%; display:flex; align-items:center; justify-content:center}
  canvas{width:100%; height:100%; display:block}
  .visual::after{
    content:""; position:absolute; inset:6% 4% 10% 8%; border-radius:50%;
    background:radial-gradient(circle, rgba(123,211,137,.13), transparent 66%);
    filter:blur(30px); pointer-events:none;
  }

  @media (max-width:980px){
    body{overflow:auto}
    .hero{grid-template-columns:1fr; height:auto; padding:56px 22px 40px; gap:8px}
    .visual{order:-1; height:44vh}
    h1{font-size:34px}
    .btn{height:52px; padding:0 22px; font-size:16px}
    .marks{gap:18px; margin-top:26px; padding-top:20px}
  }
</style>
</head>
<body>
<div class="grid"></div>

<section class="hero">
  <div class="copy">
    <span class="eyebrow"><i></i>바둑으로 자라는 생각</span>

    <h1>한 수 한 수,<br><span class="accent">두뇌가 자란다</span></h1>

    <p class="sub">
      바둑은 <b>계산</b>과 <b>직관</b>을 함께 쓰는 놀이입니다.
      아이는 수를 읽으며 집중력을, 형세를 보며 판단력을 키웁니다.
      <b>매일 20분</b>의 수읽기가 아이의 사고를 바꿉니다.
    </p>

    <div class="cta">
      <button class="btn btn-primary">▶ 바둑 시작하기</button>
      <button class="btn btn-ghost">▣ 바둑 배우기</button>
    </div>

    <div class="marks">
      <div class="mark"><b>집중력</b><span>한 수를 읽는 힘</span></div>
      <div class="mark"><b>판단력</b><span>형세를 보는 눈</span></div>
      <div class="mark"><b>인내심</b><span>끝까지 두는 마음</span></div>
    </div>
  </div>

  <div class="visual">
    <canvas id="brain"></canvas>
  </div>
</section>

<script>
(function () {
  var cv = document.getElementById('brain');
  var ctx = cv.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;

  function resize() {
    var r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  /* ── 두뇌 실루엣 (베지어) ── */
  function brainPath(cx, cy, s) {
    var p = new Path2D();
    p.moveTo(cx - 0.02 * s, cy - 0.50 * s);
    p.bezierCurveTo(cx - 0.34 * s, cy - 0.52 * s, cx - 0.52 * s, cy - 0.30 * s, cx - 0.50 * s, cy - 0.06 * s);
    p.bezierCurveTo(cx - 0.60 * s, cy + 0.02 * s, cx - 0.56 * s, cy + 0.24 * s, cx - 0.40 * s, cy + 0.26 * s);
    p.bezierCurveTo(cx - 0.42 * s, cy + 0.42 * s, cx - 0.24 * s, cy + 0.50 * s, cx - 0.10 * s, cy + 0.42 * s);
    p.bezierCurveTo(cx - 0.04 * s, cy + 0.56 * s, cx + 0.10 * s, cy + 0.56 * s, cx + 0.16 * s, cy + 0.40 * s);
    p.bezierCurveTo(cx + 0.32 * s, cy + 0.48 * s, cx + 0.46 * s, cy + 0.36 * s, cx + 0.44 * s, cy + 0.20 * s);
    p.bezierCurveTo(cx + 0.60 * s, cy + 0.12 * s, cx + 0.60 * s, cy - 0.14 * s, cx + 0.46 * s, cy - 0.22 * s);
    p.bezierCurveTo(cx + 0.50 * s, cy - 0.44 * s, cx + 0.24 * s, cy - 0.54 * s, cx + 0.02 * s, cy - 0.50 * s);
    p.closePath();
    return p;
  }

  var nodes = [], edges = [], pulses = [], stones = [];
  var T = 0;

  function build() {
    nodes = []; edges = []; pulses = []; stones = [];
    var cx = W * 0.5, cy = H * 0.5;
    var s = Math.min(W, H) * 0.92;

    /* 격자 교차점 중 두뇌 안쪽만 노드로 */
    var N = 15, step = s / (N + 3);
    var path = brainPath(cx, cy, s);
    var tmp = document.createElement('canvas').getContext('2d');

    for (var i = -N; i <= N; i++) {
      for (var j = -N; j <= N; j++) {
        var x = cx + i * step, y = cy + j * step;
        if (!tmp.isPointInPath(path, x, y)) continue;
        nodes.push({ x: x, y: y, i: i, j: j, ph: Math.random() * Math.PI * 2 });
      }
    }

    /* 이웃 연결 */
    var key = {};
    nodes.forEach(function (n) { key[n.i + ',' + n.j] = n; });
    nodes.forEach(function (n) {
      [[1, 0], [0, 1], [1, 1], [1, -1]].forEach(function (d) {
        var m = key[(n.i + d[0]) + ',' + (n.j + d[1])];
        if (m) edges.push({ a: n, b: m });
      });
    });

    /* 바둑돌: 일부 노드에 흑/백 (점점 늘어나는 느낌) */
    nodes.forEach(function (n) {
      if (Math.random() < 0.16) stones.push({ n: n, black: Math.random() < 0.55, t: Math.random() });
    });

    window.__brain = { path: path, cx: cx, cy: cy, s: s, step: step };
  }

  function spawnPulse() {
    if (!nodes.length) return;
    var a = nodes[(Math.random() * nodes.length) | 0];
    var near = edges.filter(function (e) { return e.a === a; });
    if (!near.length) return;
    var e = near[(Math.random() * near.length) | 0];
    pulses.push({ x: e.a.x, y: e.a.y, tx: e.b.x, ty: e.b.y, t: 0, sp: 0.6 + Math.random() * 0.9 });
    if (pulses.length > 60) pulses.shift();
  }

  function draw(dt) {
    T += dt;
    ctx.clearRect(0, 0, W, H);
    var B = window.__brain;
    if (!B) return;

    /* 두뇌 내부 은은한 채움 */
    ctx.save();
    ctx.clip(B.path);
    var g = ctx.createRadialGradient(B.cx, B.cy - B.s * 0.08, B.s * 0.05, B.cx, B.cy, B.s * 0.62);
    g.addColorStop(0, 'rgba(123,211,137,.16)');
    g.addColorStop(0.55, 'rgba(90,170,120,.07)');
    g.addColorStop(1, 'rgba(10,30,20,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    /* 격자선 (두뇌 안쪽) */
    ctx.save();
    ctx.clip(B.path);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(170,225,185,.16)';
    edges.forEach(function (e) {
      ctx.beginPath();
      ctx.moveTo(e.a.x, e.a.y);
      ctx.lineTo(e.b.x, e.b.y);
      ctx.stroke();
    });
    ctx.restore();

    /* 두뇌 외곽선 (호흡) */
    var breathe = 1 + Math.sin(T * 1.2) * 0.006;
    ctx.save();
    ctx.translate(B.cx, B.cy);
    ctx.scale(breathe, breathe);
    ctx.translate(-B.cx, -B.cy);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(150,235,175,.5)';
    ctx.shadowColor = 'rgba(123,211,137,.55)';
    ctx.shadowBlur = 26;
    ctx.stroke(B.path);
    ctx.restore();

    /* 돌 */
    var r = Math.max(4, B.step * 0.42);
    stones.forEach(function (s) {
      var k = 0.55 + 0.45 * Math.sin(T * 1.1 + s.n.ph);
      ctx.beginPath();
      ctx.arc(s.n.x, s.n.y, r, 0, Math.PI * 2);
      if (s.black) {
        ctx.fillStyle = 'rgba(12,18,16,.92)';
        ctx.fill();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = 'rgba(210,240,220,' + (0.18 + 0.3 * k) + ')';
        ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(238,248,240,' + (0.72 + 0.2 * k) + ')';
        ctx.fill();
      }
    });

    /* 신호 (모션 그래픽 핵심) */
    if (Math.random() < 0.55) spawnPulse();
    for (var i = pulses.length - 1; i >= 0; i--) {
      var p = pulses[i];
      p.t += dt * p.sp;
      if (p.t >= 1) { pulses.splice(i, 1); continue; }
      var e2 = p.t * p.t * (3 - 2 * p.t);
      var x = p.x + (p.tx - p.x) * e2;
      var y = p.y + (p.ty - p.y) * e2;
      var al = Math.sin(Math.PI * p.t);

      ctx.beginPath();
      ctx.moveTo(p.x + (p.tx - p.x) * Math.max(0, e2 - 0.28), p.y + (p.ty - p.y) * Math.max(0, e2 - 0.28));
      ctx.lineTo(x, y);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(160,240,185,' + (0.45 * al) + ')';
      ctx.stroke();

      var rr = 3.2;
      var rg = ctx.createRadialGradient(x, y, 0, x, y, rr * 5);
      rg.addColorStop(0, 'rgba(210,255,220,' + (0.95 * al) + ')');
      rg.addColorStop(0.35, 'rgba(123,211,137,' + (0.5 * al) + ')');
      rg.addColorStop(1, 'rgba(123,211,137,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(x, y, rr * 5, 0, Math.PI * 2);
      ctx.fill();
    }

    /* 성장 링 (주기적 확산) */
    var cycle = (T * 0.35) % 1;
    ctx.beginPath();
    ctx.arc(B.cx, B.cy, B.s * (0.18 + cycle * 0.42), 0, Math.PI * 2);
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = 'rgba(242,200,122,' + (0.22 * (1 - cycle)) + ')';
    ctx.stroke();

    /* 노드 발광 */
    nodes.forEach(function (n) {
      var k = 0.5 + 0.5 * Math.sin(T * 1.6 + n.ph);
      if (k < 0.86) return;
      ctx.beginPath();
      ctx.arc(n.x, n.y, 1.8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(190,245,205,' + (0.5 * k) + ')';
      ctx.fill();
    });
  }

  var last = performance.now();
  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    draw(dt);
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
