<!DOCTYPE html>
<html lang="ko">
<head>
  <style>[hidden]{display:none!important;}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>🎓 Teaching Zone — 바둑스쿨 교재 사령탑</title>
<link rel="preload" as="image" href="images/board_wood_grain.png">

<link rel="stylesheet" href="style.css?v=1793419809">
<link rel="stylesheet" href="/unified-nav.css?v=header-edufun-20261031">
<script src="/unified-nav.js?v=header-edufun-20261031" defer></script>
</head>
<body data-bks-page="teacher">

<!-- 메인 강사 모드 레이아웃 -->
<div id="teacherApp" class="teacher-app">
  
  <!-- 상단 강사 헤더바 -->
  <header class="teacher-header">
    <div class="header-left">
      <span class="badge-teacher">🎓 Teaching Zone</span>
      <h1 id="currentBookTitle">교재를 선택해 주세요</h1>
      <span id="currentChapterTitle" class="chapter-title-tag"></span>
    </div>
    <div class="header-right">
        <button type="button" id="btnOpenSettings" class="btn-tool" title="환경설정 (바탕화면, 바둑판, 바둑알, 음량)">
          <span>⚙️</span> 환경설정
        </button>
      <button type="button" id="btnFullscreen" class="btn-tool" title="빔프로젝터/대형화면용 전체화면">⛶ 전체화면</button>
      <a href="/#home" class="btn-tool home">← 홈으로</a>
    </div>
  </header>

  <div class="teacher-body">
    
    <!-- 좌측 메인 대형 수업 바둑판 영역 -->
    <main class="teacher-stage">
      


      <!-- 대형 수업 바둑판 캔버스 -->
      <div class="board-container" id="boardContainer">
        <canvas id="teachingBoard"></canvas>

        <!-- 🌟 차분하고 품격 있는 바둑판 옆 피드백 카드 (정답 / 오답) 🌟 -->
        <div id="sideFeedbackCard" class="side-feedback-card" hidden>
          <div class="feedback-emblem" id="feedbackEmblem"></div>
          <div class="feedback-text" id="feedbackText">정답입니다</div>
        </div>
      </div>





    </main>

    <!-- 우측 사이드바: 12개 시리즈 및 166권 교재 선택 -->
    <aside class="teacher-sidebar">
      <div class="sidebar-section">
        <label for="seriesSelect" class="sidebar-label">📚 교육 시리즈 (총 12종)</label>
        <select id="seriesSelect" class="form-select"></select>
      </div>

      <div class="sidebar-section">
        <label for="bookSelect" class="sidebar-label">📖 권 선택 (총 166권)</label>
        <select id="bookSelect" class="form-select"></select>
      </div>

      <div class="sidebar-section">
        <label for="chapterSelect" class="sidebar-label">📑 단원 (챕터)</label>
        <select id="chapterSelect" class="form-select"></select>
      </div>

      <div class="sidebar-section problem-list-section">
        <div class="section-title-row">
          <span class="sidebar-label">🎯 단원 문제 목록</span>
          <span id="problemProgress" class="problem-progress">0 / 0</span>
        </div>
        <div id="problemGrid" class="problem-grid"></div>
        <div class="sidebar-nav-controls" id="sidebarNavControls">
          <button type="button" id="btnPrevProblem" class="btn-nav">이전 문제</button>
          <span class="problem-nav-indicator" id="navIndicator">1 / 25</span>
          <button type="button" id="btnNextProblem" class="btn-nav primary">다음 문제</button>
        </div>

        <!-- 🌟 문제 지문 및 힌트/정답 박스 (우측 사이드바 이전문제 버튼 하단) 🌟 -->
        <section class="question-bar" id="sidebarQuestionBar">
          <div class="question-header">
            <span class="q-num" id="qNumBadge">문제 1</span>
            <span class="q-turn" id="qTurnBadge">⚫ 흑선</span>
            <button type="button" id="btnHint" class="btn-hint">💡 힌트</button>
            <button type="button" id="btnAnswer" class="btn-answer">👁️ 정답</button>
          </div>
          <p class="question-text" id="questionText">문제를 불러오는 중입니다...</p>
          <div class="hint-box" id="hintBox" hidden>
            <span class="hint-icon">💡</span> <span id="hintText"></span>
          </div>
        </section>
      </div>

      <!-- 🌟 강사용 수업 특수 툴바 (우측 사이드바 내장형) 🌟 -->
      <div class="teaching-toolbar" id="teachingToolbar">
        <div class="tool-group">
          <button type="button" class="tool-btn btn-trial" id="btnToggleTrial" title="놓아보기 모드 토글">
            <span>✍️</span> 놓아보기
          </button>
        </div>
        <div class="tool-group placement-group">
          <button type="button" class="tool-btn active" data-place-mode="alternate" title="흑·백 교차 착수">⚫⚪</button>
          <button type="button" class="tool-btn" data-place-mode="blackOnly" title="흑돌만 연속 착수">⚫</button>
          <button type="button" class="tool-btn" data-place-mode="whiteOnly" title="백돌만 연속 착수">⚪</button>
        </div>
        <div class="tool-group nav-group">
          <button type="button" class="tool-btn" id="btnNavFirst" title="처음으로">|◀</button>
          <button type="button" class="tool-btn" id="btnNavPrev" title="한 수 무르기(뒤로)">◀</button>
          <button type="button" class="tool-btn" id="btnNavNext" title="한 수 앞으로">▶</button>
          <button type="button" class="tool-btn" id="btnNavLast" title="끝으로">▶|</button>
          <button type="button" class="tool-btn" id="btnClearBoard" title="문제 처음 상태로 초기화">🔄 초기화</button>
        </div>
        <div class="tool-group assist-group">
          <button type="button" class="tool-btn" id="btnToggleAtari" title="단수 맞은 돌 빨간 링 표시">🚨</button>
          <button type="button" class="tool-btn" id="btnToggleSweat" title="단수 돌 3D 땀방울 연출">💦</button>
          <button type="button" class="tool-btn" id="btnToggleCoords" title="바둑판 좌표 표시">🔤 좌표</button>
          <button type="button" class="tool-btn" id="btnToggleNumbers" title="착수 수순 번호 표시">🔢 수순</button>
        </div>
      </div>
    </aside>

  </div>

</div>


<!-- 🌟 환경설정 모달 (바탕화면, 바둑판, 바둑알, 음량) 🌟 -->
<div id="settingsModal" class="settings-modal" hidden>
  <div class="settings-dialog">
    <div class="settings-header">
      <h2>⚙️ 환경설정</h2>
      <button type="button" id="btnCloseSettings" class="btn-modal-close" title="닫기">✕</button>
    </div>
    <div class="settings-body">
      <!-- 1. 바탕화면 테마 -->
      <section class="settings-sec">
        <h3>🎨 바둑판 바탕</h3>
        <div class="settings-options" data-setting="theme">
          <button type="button" class="opt-card active" data-val="theme-green">
            <span class="color-dot" style="background:#eff7e4;border:2px solid #4a8a3a;"></span>
            <span>시그니처 초록</span>
          </button>
          <button type="button" class="opt-card" data-val="theme-forest">
            <span class="color-dot" style="background:#274720;border:2px solid #142710;"></span>
            <span>포레스트</span>
          </button>
          <button type="button" class="opt-card" data-val="theme-cream">
            <span class="color-dot" style="background:#fef9ed;border:2px solid #f5a623;"></span>
            <span>크림화이트</span>
          </button>
          <button type="button" class="opt-card" data-val="theme-slate">
            <span class="color-dot" style="background:#334155;border:2px solid #0f172a;"></span>
            <span>모던 슬레이트</span>
          </button>
        </div>
      </section>

      <!-- 2. 바둑판 스킨 -->
      <section class="settings-sec">
        <h3>🪵 바둑판 스킨</h3>
        <div class="settings-options" data-setting="boardSkin">
          <button type="button" class="opt-card active" data-val="wood">
            <span class="color-dot" style="background:#f2cc84;border:2px solid #7c481e;"></span>
            <span>밝은 비자목</span>
          </button>
          <button type="button" class="opt-card" data-val="darkwood">
            <span class="color-dot" style="background:#deb06c;border:2px solid #5c300c;"></span>
            <span>진한 원목</span>
          </button>
          <button type="button" class="opt-card" data-val="sky">
            <span class="color-dot" style="background:#dbeafe;border:2px solid #2563eb;"></span>
            <span>시원한 스카이</span>
          </button>
        </div>
      </section>

      <!-- 3. 바둑알 스타일 -->
      <section class="settings-sec">
        <h3>⚪ 바둑알 스타일</h3>
        <div class="settings-options" data-setting="stoneStyle">
          <button type="button" class="opt-card active" data-val="classic">
            <span class="stone-icon-pair">⚫⚪</span>
            <span>정통 명품돌</span>
          </button>
          <button type="button" class="opt-card" data-val="gem">
            <span class="stone-icon-pair">💎💖</span>
            <span>영롱 보석돌</span>
          </button>
          <button type="button" class="opt-card" data-val="cute">
            <span class="stone-icon-pair">👀✨</span>
            <span>눈 두개 돌</span>
          </button>
          <button type="button" class="opt-card" data-val="cat">
            <span class="stone-icon-pair">🐱🐾</span>
            <span>고양이</span>
          </button>
          <button type="button" class="opt-card" data-val="galaxy">
            <span class="stone-icon-pair">🌌✨</span>
            <span>신비 우주</span>
          </button>
          <button type="button" class="opt-card" data-val="crystal">
            <span class="stone-icon-pair">💠🤍</span>
            <span>흑백 다이아</span>
          </button>
        </div>
      </section>

      <!-- 4. 음량 & 착수음 -->
      <section class="settings-sec">
        <h3>🔊 음량 및 착수 효과음</h3>
        <div class="volume-slider-box">
          <div class="vol-label-row">
            <span>마스터 볼륨</span>
            <b id="volValLabel">100%</b>
          </div>
          <input type="range" id="volRange" min="0" max="150" value="100" class="vol-range">
        </div>
        <div class="settings-options sound-options" data-setting="soundType">
          <button type="button" class="opt-card active" data-val="classic">
            <span>🎵 명품 바둑돌</span>
          </button>
          <button type="button" class="opt-card" data-val="deep">
            <span>🪵 묵직한 통나무</span>
          </button>
          <button type="button" class="opt-card" data-val="crisp">
            <span>⚡ 경쾌한 딱!</span>
          </button>
          <button type="button" class="opt-card" data-val="pop">
            <span>🫧 귀여운 퐁퐁</span>
          </button>
        </div>
      </section>
    </div>
    <div class="settings-footer">
      <button type="button" id="btnSaveSettings" class="btn-primary">✕ 닫기</button>
    </div>
  </div>
</div>

<!-- 정답 / 오답 알림 토스트 -->
<div id="teacherToast" class="teacher-toast" hidden></div>

<script src="audio.js?v=20261028-solidwood&t=teacher-panel-v15"></script>
<script src="app.js?v=1793421879"></script>
</body>
</html>
