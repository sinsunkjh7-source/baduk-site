    display: flex;
    align-items: center;
    gap: 8px;
  }

    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .badge-think { background: #dbeafe; color: #1e40af; }
  .badge-logic { background: #fef3c7; color: #92400e; }
  .badge-alpha { background: #fce7f3; color: #9d174d; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .tab-btn {
    background: #e2e8f0;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab-btn:hover {
    background: #cbd5e1;
  }
  .tab-btn.active {
    background: #2563eb;
    color: #fff;
  }
  .toggle-opt {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  @media (min-width: 1400px) {
    .grid-container {
      grid-template-columns: repeat(6, 1fr);
    }
  }
  @media (min-width: 1800px) {
    .grid-container {
      grid-template-columns: repeat(8, 1fr);
    }
  }

  .problem-card {
    background: #ffffff;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .problem-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.08);
  }
  .card-header {
    padding: 6px 10px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    font-weight: 700;
  }
  .card-header .num {
    color: #2563eb;
  }
  .card-header .src {
    color: #64748b;
    font-size: 10.5px;
    max-width: 140px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .board-wrap {
    position: relative;
    width: 100%;

    cursor: pointer;
  }
  .board-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .card-footer {
    padding: 6px 10px;
    font-size: 11px;
    background: #ffffff;
    border-top: 1px solid #f1f5f9;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .ans-text {
    font-family: monospace;
    font-size: 11px;
    font-weight: 700;
    color: #dc2626;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

    color: #475569;
    font-size: 10.5px;
  }

or];W[mr];W[mq];W[ro];W[rn];W[qn];T[ps]", "answer1": ";B[qs];W[pr];B[nr]", "desc": ""}];
var currentFilter = 'all';
var showAns = true;

function filterSeries(filter) {
  currentFilter = filter;
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
  renderList();
}

function toggleAnswers() {
  showAns = document.getElementById('showAnswers').checked;
  renderList();
}

function renderList() {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  
  var filtered = problems.filter(function(p) {
    if (currentFilter === 'think') return p.book.indexOf('씽크탱크') !== -1;
    if (currentFilter === 'logic') return p.book.indexOf('논리바둑') !== -1;
    if (currentFilter === 'alpha') return p.book.indexOf('알파바둑') !== -1;
    return true;
  });

  filtered.forEach(function(p, idx) {
    var card = document.createElement('div');
    card.className = 'problem-card';
    
    var tagClass = 'badge-think';
    if (p.book.indexOf('논리') !== -1) tagClass = 'badge-logic';
    if (p.book.indexOf('알파') !== -1) tagClass = 'badge-alpha';

    // Parse moves
    var moves = [];
    var mRegex = /([BW])\[([a-s]{2})\]/g;
    var mMatch;
    while ((mMatch = mRegex.exec(p.answer1)) !== null) {
      moves.push({ color: mMatch[1], coord: mMatch[2] });
    }

    var ansSummary = moves.map(function(m, mi) {
      return (m.color === 'B' ? '흑' : '백') + (mi + 1) + '[' + m.coord + ']';
    }).join(' ➔ ');

    card.innerHTML = `
      <div class="card-header">
        <div><span class="num">#${p.num}</span> <span class="badge ${tagClass}">${p.book}</span></div>
        <div class="src" title="${p.chapter}">${p.chapter}</div>
      </div>
      <div class="board-wrap">
        <canvas class="board-canvas" id="canvas_${p.id}"></canvas>
      </div>
      <div class="card-footer">
        <div class="ans-text" title="${ansSummary}">${moves.length > 0 ? (moves.length + '수 수순: ' + ansSummary) : '정답 없음'}</div>
      </div>
    `;

    grid.appendChild(card);

    // Draw Board
    setTimeout(function() {
      drawMiniBoard('canvas_' + p.id, p.data, p.answer1);
    }, 0);
  });
}

function drawMiniBoard(canvasId, dataStr, ansStr) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var rect = canvas.getBoundingClientRect();
  var size = rect.width || 220;
  var dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  ctx.scale(dpr, dpr);

  // Parse stones
  var stones = [];
  var reg = /([BW])\[([a-s]{2})\]/g;
  var m;
  while ((m = reg.exec(dataStr)) !== null) {
    stones.push({
      c: m[1],
      x: m[2].charCodeAt(0) - 97,
      y: m[2].charCodeAt(1) - 97
    });
  }

  // Parse answer moves
  var ansMoves = [];
  if (showAns && ansStr) {
    var am;
    while ((am = reg.exec(ansStr)) !== null) {
      ansMoves.push({
        c: am[1],
        x: am[2].charCodeAt(0) - 97,
        y: am[2].charCodeAt(1) - 97
      });
    }
  }

  // Determine crop box (Focus on Lower-Right corner or bounding box)
  var allPts = stones.concat(ansMoves);
  var minX = 19, maxX = 0, minY = 19, maxY = 0;
  if (allPts.length === 0) {
    minX = 11; maxX = 18; minY = 11; maxY = 18;
  } else {
    allPts.forEach(function(pt) {
      if (pt.x < minX) minX = pt.x;
      if (pt.x > maxX) maxX = pt.x;
      if (pt.y < minY) minY = pt.y;
      if (pt.y > maxY) maxY = pt.y;
    });
  }

  // Standard corner crop (usually lower right: columns 10~18, rows 10~18)
  var startCol = Math.max(0, Math.min(minX - 1, 19 - 9));
  var endCol = 18;
  var startRow = Math.max(0, Math.min(minY - 1, 19 - 9));
  var endRow = 18;

  var gridCols = endCol - startCol;
  var gridRows = endRow - startRow;
  var cellCount = Math.max(gridCols, gridRows) + 1;

  var pad = 12;
  var cellSize = (size - pad * 2) / (cellCount - 1);

  // Background
  ctx.fillStyle = '#e4be88';
  ctx.fillRect(0, 0, size, size);

  // Draw Grid Lines
  ctx.strokeStyle = '#6b4f2c';
  ctx.lineWidth = 1;

  for (var r = startRow; r <= endRow; r++) {
    var y = pad + (r - startRow) * cellSize;
    ctx.beginPath();
    ctx.moveTo(pad, y);
    ctx.lineTo(size - pad, y);
    ctx.stroke();
  }
  for (var c = startCol; c <= endCol; c++) {
    var x = pad + (c - startCol) * cellSize;
    ctx.beginPath();
    ctx.moveTo(x, pad);
    ctx.lineTo(x, size - pad);
    ctx.stroke();
  }

  // Draw Hoshi (Star points)
  var hoshis = [
    { x: 15, y: 15 }, { x: 9, y: 15 }, { x: 15, y: 9 },
    { x: 3, y: 15 }, { x: 15, y: 3 }, { x: 3, y: 3 }
  ];
  hoshis.forEach(function(h) {
    if (h.x >= startCol && h.x <= endCol && h.y >= startRow && h.y <= endRow) {
      var hx = pad + (h.x - startCol) * cellSize;
      var hy = pad + (h.y - startRow) * cellSize;
      ctx.fillStyle = '#6b4f2c';
      ctx.beginPath();
      ctx.arc(hx, hy, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Draw Initial Stones
  var radius = cellSize * 0.46;
  stones.forEach(function(st) {
    if (st.x >= startCol && st.x <= endCol && st.y >= startRow && st.y <= endRow) {
      var sx = pad + (st.x - startCol) * cellSize;
      var sy = pad + (st.y - startRow) * cellSize;
      drawStone(ctx, sx, sy, radius, st.c);
    }
  });

  // Draw Answer Moves (① ② ③)
  if (showAns) {
    ansMoves.forEach(function(am, mi) {
      if (am.x >= startCol && am.x <= endCol && am.y >= startRow && am.y <= endRow) {
        var ax = pad + (am.x - startCol) * cellSize;
        var ay = pad + (am.y - startRow) * cellSize;
        
        // Draw badge
        ctx.fillStyle = (mi === 0) ? '#ef4444' : ((mi === 1) ? '#3b82f6' : '#10b981');
        ctx.beginPath();
        ctx.arc(ax, ay, radius * 0.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Step text
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold ' + Math.round(radius * 1.1) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText((mi + 1).toString(), ax, ay + 0.5);
      }
    });
  }
}

function drawStone(ctx, x, y, r, color) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = 3;
  ctx.shadowOffsetX = 1.5;
  ctx.shadowOffsetY = 1.5;

  var grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
  if (color === 'B') {
    grad.addColorStop(0, '#555555');
    grad.addColorStop(1, '#111111');
  } else {
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(1, '#d8d8d8');
  }

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// Initialize
renderList();
