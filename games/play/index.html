<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>🤖 AI 바둑 대국 — 바둑스쿨</title>
  <link rel="stylesheet" href="style.css?v=big-3">
  <link rel="stylesheet" href="/unified-nav.css?v=fun-menu-20261029L">
  <script src="/unified-nav.js?v=fun-menu-20261029L" defer></script>
</head>
<body data-bks-page="play">

<div class="play-app" id="playApp">

  <!-- 🌟 중앙 메인 대국 스테이지 (놓아보기 캔버스 탑재) 🌟 -->
  <main class="play-stage theme-green" id="playStage">
    
    <!-- AI 생각 중 알림 배지 -->
    <div class="ai-thinking-badge" id="aiThinkingBadge" hidden>
      <span class="thinking-spinner">⏳</span>
      <span id="aiThinkingName">지혜로운 판다</span>이(가) 생각 중입니다...
    </div>

    <!-- 바둑판 캔버스 컨테이너 -->
    <div class="board-container" id="boardContainer">
      <div class="canvas-stack" id="canvasStack">
        <canvas id="boardCanvas"></canvas>
      </div>
    </div>

    <!-- 토스트 메시지 -->
    <div class="play-toast" id="playToast" hidden></div>
  </main>

  <!-- 🌟 하단 조작 툴바 🌟 -->
  <footer class="play-toolbar" id="playToolbar">
    <!-- 대국 수순 & 진행 정보 배지 -->
    <div class="move-info-badge" id="moveInfoBadge">
      ⚫ 내 차례 (흑) | 0수 | 따낸 돌 흑 0 : 백 0
    </div>

    <!-- 대국 액션 조작 -->
    <div class="tool-group action-group">
      <button type="button" class="tool-btn primary-btn" id="btnOpenMatchModal" title="새 대국 시작 및 AI 수준/접바둑 옵션 설정">⚔️ 새 대국 (옵션)</button>
      <button type="button" class="tool-btn" id="btnUndo" title="한 수 무르기">↩️ 무르기</button>
      <button type="button" class="tool-btn" id="btnPass" title="착수 넘기기 (한 수 쉬기)">⏭️ 패스</button>
      <button type="button" class="tool-btn" id="btnCount" title="집 계산(계가) 및 승패 확인">🧮 계가하기</button>
      <button type="button" class="tool-btn warn" id="btnResign" title="기권 (항복)">🏳️ 기권</button>
    </div>

    <!-- 시각 보조 도구 (단수, 땀방울, 수순) -->
    <div class="tool-group assist-group">
      <button type="button" class="tool-btn active" id="btnToggleAtari" title="단수 맞은 돌 붉은 링 표시">🚨 단수</button>
      <button type="button" class="tool-btn active" id="btnToggleSweat" title="단수 돌 3D 땀방울 연출">💦 땀방울</button>
      <button type="button" class="tool-btn" id="btnToggleNumbers" title="착수 수순 번호 표시">🔢 수순</button>
    </div>
  </footer>

    <!-- ⚔️ 새 대국 설정 & 옵션 모달 (AI 수준, 접바둑, 판 크기, 돌 선택) ⚔️ -->
  <div class="match-modal" id="matchModal" hidden>
    <div class="match-card">
      <div class="match-header">
        <h2 class="match-title">⚔️ 새 대국 설정</h2>
        <button type="button" class="btn-close-match" id="btnCloseMatchModal" title="닫기">✕</button>
      </div>

      <div class="match-body">
        <!-- 1. 대국 방식 (AI vs 2인 대국) -->
        <div class="match-section">
          <label class="match-section-label">🎮 대국 방식</label>
          <div class="match-chips" id="matchModeChips">
            <button type="button" class="match-chip active" data-mode="ai">🤖 AI와 대국</button>
            <button type="button" class="match-chip" data-mode="pvp">👥 친구와 둘이서 (2인 맞대국)</button>
          </div>
        </div>

        <!-- 2. AI 상대 기력 (난이도) -->
        <div class="match-section" id="matchAiDifficultySection">
          <label class="match-section-label">🤖 AI 상대 기력 (5단계 동물 봇)</label>
          <div class="match-bot-grid" id="matchBotGrid">
            <button type="button" class="match-bot-card" data-bot="beginner">
              <span class="bot-card-avatar">🐥</span>
              <div class="bot-card-info">
                <strong>삐약이</strong>
                <small>입문 (18급)</small>
              </div>
            </button>
            <button type="button" class="match-bot-card" data-bot="intermediate">
              <span class="bot-card-avatar">🐶</span>
              <div class="bot-card-info">
                <strong>바둑이</strong>
                <small>초급 (12급)</small>
              </div>
            </button>
            <button type="button" class="match-bot-card" data-bot="advanced">
              <span class="bot-card-avatar">🦊</span>
              <div class="bot-card-info">
                <strong>영리한 여우</strong>
                <small>중급 (5급)</small>
              </div>
            </button>
            <button type="button" class="match-bot-card active" data-bot="dan">
              <span class="bot-card-avatar">🐼</span>
              <div class="bot-card-info">
                <strong>지혜로운 판다</strong>
                <small>고급 (아마 1단)</small>
              </div>
            </button>
            <button type="button" class="match-bot-card" data-bot="master">
              <span class="bot-card-avatar">🐯</span>
              <div class="bot-card-info">
                <strong>용맹한 호랑이</strong>
                <small>최강 (아마 5단)</small>
              </div>
            </button>
          </div>
        </div>

        <!-- 3. 바둑판 크기 -->
        <div class="match-section">
          <label class="match-section-label">📐 바둑판 크기</label>
          <div class="match-chips" id="matchSizeChips">
            <button type="button" class="match-chip active" data-size="19">19줄 (정규 바둑판)</button>
            <button type="button" class="match-chip" data-size="13">13줄 (중급 바둑판)</button>
            <button type="button" class="match-chip" data-size="9">9줄 (입문 빠른 바둑판)</button>
          </div>
        </div>

        <!-- 4. 내 돌 선택 -->
        <div class="match-section">
          <label class="match-section-label">⚫⚪ 내 돌 선택</label>
          <div class="match-chips" id="matchColorChips">
            <button type="button" class="match-chip active" data-color="1">⚫ 흑돌 (선공)</button>
            <button type="button" class="match-chip" data-color="2">⚪ 백돌 (후공)</button>
            <button type="button" class="match-chip" data-color="random">🎲 돌가리기 (랜덤)</button>
          </div>
        </div>

        <!-- 5. 치수 및 접바둑 (핸디캡) -->
        <div class="match-section">
          <label class="match-section-label">⭐ 치수 / 접바둑 옵션</label>
          <div class="match-chips" id="matchHandicapChips">
            <button type="button" class="match-chip active" data-handicap="0">⚖️ 호선 (맞바둑 · 덤 6.5집)</button>
            <button type="button" class="match-chip" data-handicap="1">🏳️ 정선 (덤 0.5집)</button>
            <button type="button" class="match-chip" data-handicap="2">2점 접바둑</button>
            <button type="button" class="match-chip" data-handicap="3">3점 접바둑</button>
            <button type="button" class="match-chip" data-handicap="4">4점 접바둑</button>
            <button type="button" class="match-chip" data-handicap="5">5점 접바둑</button>
            <button type="button" class="match-chip" data-handicap="6">6점 접바둑</button>
            <button type="button" class="match-chip" data-handicap="7">7점 접바둑</button>
            <button type="button" class="match-chip" data-handicap="8">8점 접바둑</button>
            <button type="button" class="match-chip" data-handicap="9">9점 접바둑</button>
          </div>
        </div>
      </div>

      <div class="match-footer">
        <button type="button" class="btn-start-match" id="btnStartCustomMatch">🚀 이 설정으로 대국 시작!</button>
        <button type="button" class="btn-cancel-match" id="btnCancelMatch">✕ 닫기</button>
      </div>
    </div>
  </div>

<!-- 🌟 대국 결과 & 계가 모달 (전역 오버레이) 🌟 -->
  <div class="result-modal" id="resultModal" hidden>
    <div class="result-card">
      <span class="result-badge">🏆</span>
      <h2 class="result-title" id="resultTitle">대국 결과</h2>
      <p class="result-desc" id="resultDesc">대국이 종료되었습니다.</p>
      <div class="result-stats-table" id="resultStatsTable"></div>
      <div class="result-actions">
        <button type="button" class="result-btn-again" id="btnResultAgain">한 판 더 두기</button>
        <button type="button" class="result-btn-close" id="btnResultClose">판 살펴보기</button>
      </div>
    </div>
  </div>

  <!-- ⚙️ 환경설정 패널 (통합 내비 상단 ⚙️ 설정 버튼 마운트용) ⚙️ -->
  <div class="settings-panel" id="settingsPanel" hidden>
    <div class="settings-header">
      <span class="settings-title">⚙️ 환경 설정</span>
      <button type="button" class="btn-close-settings" id="btnCloseSettings">✕</button>
    </div>

    <!-- 바탕화면 테마 -->
    <div class="setting-group">
      <span class="setting-label">🎨 바둑판 바탕</span>
      <div class="setting-options" id="optTheme">
        <button type="button" class="setting-opt-btn" data-theme="green">시그니처 초록</button>
        <button type="button" class="setting-opt-btn" data-theme="cream">크림화이트</button>
        <button type="button" class="setting-opt-btn" data-theme="forest">포레스트</button>
        <button type="button" class="setting-opt-btn" data-theme="slate">모던 슬레이트</button>
      </div>
    </div>

    <!-- 바둑판 스킨 -->
    <div class="setting-group">
      <span class="setting-label">🪵 바둑판 재질</span>
      <div class="setting-options" id="optBoardSkin">
        <button type="button" class="setting-opt-btn" data-skin="wood">밝은 비자목</button>
        <button type="button" class="setting-opt-btn" data-skin="darkwood">진한 원목 (나뭇결)</button>
        <button type="button" class="setting-opt-btn" data-skin="sky">시원한 스카이</button>
      </div>
    </div>

    <!-- 바둑알 스킨 -->
    <div class="setting-group">
      <span class="setting-label">⚪ 바둑알 디자인 (6종)</span>
      <div class="setting-options" id="optStoneStyle">
        <button type="button" class="setting-opt-btn" data-stone="classic">전통 클래식</button>
        <button type="button" class="setting-opt-btn" data-stone="gem">영롱한 보석</button>
        <button type="button" class="setting-opt-btn" data-stone="cute">귀여운 눈</button>
        <button type="button" class="setting-opt-btn" data-stone="cat">3D 고양이</button>
        <button type="button" class="setting-opt-btn" data-stone="galaxy">우주 은하</button>
        <button type="button" class="setting-opt-btn" data-stone="crystal">크리스탈 다이아</button>
      </div>
    </div>

    <!-- 착수음 사운드 종류 -->
    <div class="setting-group">
      <span class="setting-label">🔊 착수음 종류</span>
      <div class="setting-options" id="optSoundType">
        <button type="button" class="setting-opt-btn" data-sound="classic">경쾌한 바둑돌</button>
        <button type="button" class="setting-opt-btn" data-sound="stone">맑은 또각</button>
        <button type="button" class="setting-opt-btn" data-sound="wood">둔탁한 묵직</button>
        <button type="button" class="setting-opt-btn" data-sound="maple">은은한 단풍</button>
      </div>
    </div>

    <!-- 음량 조절 -->
    <div class="setting-group">
      <span class="setting-label">🔈 착수음 음량</span>
      <div class="volume-slider-row">
        <input type="range" min="0" max="100" value="100" class="volume-slider" id="volumeSlider">
        <span class="volume-val" id="volumeVal">100%</span>
      </div>
    </div>
  </div>

</div>

<!-- 엔진 & AI & 오디오 & 앱 스크립트 -->
<script src="gnugo/gnugo.js"></script>
<script src="gnugo/gnugo-bridge.js"></script>
<script src="engine.js?v=20261030-gnugo-v1"></script>
<script src="ai.js?v=20261029-play-ai-v6"></script>
<script src="audio.js?v=20261029-play-ai-v6"></script>
<script src="app.js?v=20261029-wood-texture-v4"></script>
</body>
</html>
