<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대국 — 바둑스쿨</title>
<link rel="stylesheet" href="style.css?v=3">
<script src="../../js/site_lock.js?v=5"></script>
</head>
<body>
<div class="wrap">

  <main class="board-area">
    <div class="turn-bar">
      <span class="turn-stone" id="turnStone"></span>
      <span class="turn-text" id="turnText">흑 차례</span>
      <span class="cap-info" id="capInfo">따낸 돌 0 : 0</span>
      <span class="move-count" id="moveCount">0수</span>
    </div>

    <div class="board-box" id="boardBox">
      <canvas id="board"></canvas>
      <div class="result" id="result" hidden>
        <div class="result-card">
          <p class="result-title" id="resultTitle">흑 승리</p>
          <p class="result-sub" id="resultSub"></p>
          <button class="btn primary" id="btnAgain" type="button">다시 두기</button>
        </div>
      </div>
    </div>
  </main>

  <aside class="panel">
    <section class="card">
      <h2>대전 상대</h2>
      <div class="seg" id="modeSeg">
        <button class="seg-btn active" data-mode="ai" type="button">AI 대전</button>
        <button class="seg-btn" data-mode="pvp" type="button">2인 대전</button>
      </div>
    </section>

    <section class="card" id="diffCard">
      <h2>AI 난이도</h2>
      <div class="seg col" id="diffSeg">
        <button class="seg-btn" data-diff="beginner" type="button">🌱 입문</button>
        <button class="seg-btn" data-diff="intermediate" type="button">🌿 초급</button>
        <button class="seg-btn" data-diff="advanced" type="button">🔥 중급</button>
        <button class="seg-btn active" data-diff="dan" type="button">⚔️ 고급</button>
        <button class="seg-btn" data-diff="master" type="button">👑 최강</button>
      </div>
    </section>

    <section class="card" id="colorCard">
      <h2>내 돌</h2>
      <div class="seg" id="colorSeg">
        <button class="seg-btn active" data-color="1" type="button">⚫ 흑 (선공)</button>
        <button class="seg-btn" data-color="2" type="button">⚪ 백 (후공)</button>
      </div>
    </section>

    <section class="card">
      <h2>바둑판</h2>
      <div class="seg" id="sizeSeg">
        <button class="seg-btn" data-size="9" type="button">9줄</button>
        <button class="seg-btn" data-size="13" type="button">13줄</button>
        <button class="seg-btn active" data-size="19" type="button">19줄</button>
      </div>
    </section>

    <section class="card">
      <h2>화면 옵션</h2>
      <div class="seg" id="skinSeg">
        <button class="seg-btn active" data-skin="wood" type="button">나무</button>
        <button class="seg-btn" data-skin="green" type="button">초록</button>
        <button class="seg-btn" data-skin="sky" type="button">하늘</button>
      </div>
      <label class="chk"><input type="checkbox" id="optCoords"> 좌표 표시</label>
      <label class="chk"><input type="checkbox" id="optNumbers"> 수순 번호</label>
      <label class="chk"><input type="checkbox" id="optTerritory"> 집(영역) 표시</label>
      <button class="btn" id="btnCount" type="button">🧮 계가하기</button>
    </section>

    <section class="card">
      <h2>조작</h2>
      <button class="btn" id="btnUndo" type="button">↩️ 무르기</button>
      <button class="btn" id="btnPass" type="button">⏭️ 패스</button>
      <button class="btn" id="btnResign" type="button">🏳️ 기권</button>
      <button class="btn" id="btnRestart" type="button">🔄 새 대국</button>
    </section>
  </aside>

</div>
<div class="toast" id="toast" hidden></div>
<script src="../../js/audio.js?v=15"></script>
<script src="engine.js?v=1"></script>
<script src="ai.js?v=1"></script>
<script src="game.js?v=2"></script>
</body>
</html>
