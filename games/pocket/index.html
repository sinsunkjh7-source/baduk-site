<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>포켓볼 — 바둑스쿨 Fun</title>
<link rel="stylesheet" href="/unified-nav.css?v=fun-menu-20261029i">
<link rel="stylesheet" href="style.css?v=big-2">
<script src="/unified-nav.js?v=fun-menu-20261029i" defer></script>
</head>
<body data-bks-page="pocket">

<main class="p-wrap">
  <section class="p-board-col">
    <div class="p-head">
      <div class="p-score"><span>득점</span><b id="score">0</b></div>
      <div class="p-score"><span>남은 공</span><b id="left">9</b></div>
      <div class="p-score"><span>시도</span><b id="shots">0</b></div>
      <div class="p-turn" id="turnBar">당신 차례</div>
    </div>

    <div class="p-canvas-box">
      <canvas id="table" width="960" height="480"></canvas>
    </div>

    <div class="p-power">
      <span class="p-power-label">세기</span>
      <div class="p-power-track"><div class="p-power-fill" id="powerFill"></div></div>
    </div>
  </section>

  <aside class="p-side">
    <h2 class="p-title">포켓볼</h2>
    <p class="p-desc">색공을 포켓에 넣으세요. <b>흰 공을 넣으면 파울</b>입니다. 공을 드래그해 방향과 세기를 정합니다.</p>

    <div class="p-actions">
      <button type="button" id="btnNew" class="p-btn primary">새 게임</button>
      <button type="button" id="btnReset" class="p-btn">공 다시 배치</button>
    </div>

    <details class="p-rules">
      <summary>규칙 보기</summary>
      <ul>
        <li>색공을 넣으면 1점</li>
        <li>흰 공을 넣으면 파울 (–1점, 흰 공 복귀)</li>
        <li>9개를 모두 넣으면 클리어</li>
      </ul>
    </details>

    <p class="p-msg" id="msg" hidden></p>
  </aside>
</main>

<script src="game.js?v=big-2"></script>
</body>
</html>
