<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오목 — 바둑스쿨</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'">
<link rel="stylesheet" href="style.css?v=big-3">
<link rel="stylesheet" href="/unified-nav.css?v=fun-menu-20261029L-characters-omok-pets-go-1793324498166">
<script src="/unified-nav.js?v=fun-menu-20261029L" defer></script>
<link rel="stylesheet" href="/games/player-arena.css?v=avatar-square-1793276832428">
<script src="/games/player-arena.js?v=omok-pets-go-1793324498166" defer></script>
<link rel="stylesheet" href="reactions.css?v=omok-pets-go-1793324498166">
</head>
<body data-bks-page="omok">
<div class="wrap">

  <main class="board-area">
    <div class="turn-bar">
      <span class="turn-stone" id="turnStone"></span>
      <span class="turn-text" id="turnText">흑 차례</span>
      <a class="home-link" href="/#home">홈으로</a>
      <button type="button" class="btn-settings-toggle" id="btnOpenSettings" title="환경설정">⚙️ 설정</button>
      <span class="move-count" id="moveCount">0수</span>
    </div>

    <div class="board-box" id="boardBox">
      <canvas id="board"></canvas>
      <div class="result" id="result" hidden>
        <div class="result-card">
          <p class="result-title" id="resultTitle">흑 승리!</p>
          <button class="btn primary" id="btnAgain" type="button">다시 두기</button>
        </div>
      </div>
    </div>
  </main>

  <aside class="panel">
    <section class="card">
      <h2>대전 상대</h2>
      <div class="seg" id="modeSeg">
        <button class="seg-btn active" data-mode="ai" type="button">AI 대전</button>
        <button class="seg-btn" data-mode="pvp" type="button">2인 대전</button>
      </div>
    </section>

    <section class="card" id="colorCard">
      <h2>내 돌</h2>
      <div class="seg" id="colorSeg">
        <button class="seg-btn active" data-color="1" type="button">⚫ 흑 (선공)</button>
        <button class="seg-btn" data-color="2" type="button">⚪ 백 (후공)</button>
      </div>
    </section>

    <section class="card" id="diffCard">
      <h2>AI 난이도</h2>
      <div class="seg col" id="diffSeg">
        <button class="seg-btn" data-diff="easy" type="button">🌱 초급</button>
        <button class="seg-btn active" data-diff="normal" type="button">🌿 중급</button>
        <button class="seg-btn" data-diff="hard" type="button">🔥 고급</button>
        <button class="seg-btn" data-diff="master" type="button">👑 마스터</button>
      </div>
    </section>

    <section class="card">
      <h2>규칙</h2>
      <label class="chk"><input type="checkbox" id="optUndo" checked> 무르기 허용</label>
      <label class="chk"><input type="checkbox" id="optBan33" checked> 흑 3·3 금수</label>
      <label class="chk"><input type="checkbox" id="optBan33White"> 백 3·3 금수</label>
    </section>

    <section class="card">
      <h2>조작</h2>
      <button class="btn" id="btnUndo" type="button">↩️ 무르기</button>
      <button class="btn" id="btnRestart" type="button">🔄 새로 시작</button>
    </section>

    <section class="card tips">
      <h2>도움말</h2>
      <p>가로·세로·대각선으로 <b>돌 5개</b>를 먼저 이으면 이깁니다.</p>
      <p class="tips-sub">3·3 금수: 열린 3이 동시에 2개 만들어지는 착수를 금지합니다 (흑/백 개별 설정).</p>
    </section>
  </aside>

</div>

  <!-- 🌟 환경설정 슬림 플로팅 패널 🌟 -->
  <div class="settings-panel" id="settingsPanel" hidden>
    <div class="settings-header">
      <span class="settings-title">⚙️ 환경 설정</span>
      <button type="button" class="btn-close-settings" id="btnCloseSettings">✕</button>
    </div>

    <!-- 바탕화면 테마 -->
    <div class="setting-group">
      <span class="setting-label">🎨 바둑판 바탕</span>
      <div class="setting-options" id="optTheme">
        <button type="button" class="setting-opt-btn active" data-theme="green">시그니처 초록</button>
        <button type="button" class="setting-opt-btn" data-theme="cream">크림화이트</button>
        <button type="button" class="setting-opt-btn" data-theme="forest">포레스트</button>
        <button type="button" class="setting-opt-btn" data-theme="slate">모던 슬레이트</button>
      </div>
    </div>

    <!-- 바둑판 스킨 -->
    <div class="setting-group">
      <span class="setting-label">🪵 바둑판 재질</span>
      <div class="setting-options" id="optBoardSkin">
        <button type="button" class="setting-opt-btn" data-skin="wood">밝은 비자목</button>
        <button type="button" class="setting-opt-btn active" data-skin="darkwood">진한 원목 (나뭇결)</button>
        <button type="button" class="setting-opt-btn" data-skin="sky">시원한 스카이</button>
      </div>
    </div>

    <!-- 바둑알 스킨 -->
    <div class="setting-group">
      <span class="setting-label">⚪ 바둑알 디자인 (6종)</span>
      <div class="setting-options" id="optStoneStyle">
        <button type="button" class="setting-opt-btn active" data-stone="classic">정통 클래식</button>
        <button type="button" class="setting-opt-btn" data-stone="gem">영롱한 보석</button>
        <button type="button" class="setting-opt-btn" data-stone="cute">귀여운 눈</button>
        <button type="button" class="setting-opt-btn" data-stone="cat">3D 고양이</button>
        <button type="button" class="setting-opt-btn" data-stone="galaxy">우주 은하</button>
        <button type="button" class="setting-opt-btn" data-stone="crystal">크리스탈 다이아</button>
      </div>
    </div>

    <!-- 착수음 사운드 종류 -->
    <div class="setting-group">
      <span class="setting-label">🔔 착수음 종류</span>
      <div class="setting-options" id="optSoundType">
        <button type="button" class="setting-opt-btn active" data-sound="classic">경쾌한 바둑돌</button>
        <button type="button" class="setting-opt-btn" data-sound="stone">맑은 딸깍</button>
        <button type="button" class="setting-opt-btn" data-sound="wood">둔탁한 묵직</button>
        <button type="button" class="setting-opt-btn" data-sound="maple">정갈한 단풍</button>
      </div>
    </div>

    <!-- 음량 조절 -->
    <div class="setting-group">
      <span class="setting-label">🔊 착수음 음량</span>
      <div class="volume-slider-row">
        <input type="range" min="0" max="100" value="100" class="volume-slider" id="volumeSlider">
        <span class="volume-val" id="volumeVal">100%</span>
      </div>
    </div>
  </div>

<div class="toast" id="toast" hidden></div>
<script src="audio.js?v=20261028-solidwood&t=static-20261027v4"></script>
<script src="ai.js?v=20261028-solidwood&t=static-20261027v4"></script>
<script src="reactions.js?v=omok-pets-go-1793324498166"></script>
<script src="game.js?v=omok-ai-pace-1793290754355"></script>
</body>
</html>
