<!DOCTYPE html><meta charset="utf-8"><title>y</title>
<style>html,body{margin:0;background:#fff}iframe{border:0;display:block;width:1400px;height:900px}</style>
<iframe id="f" src="/games/yut/index.html"></iframe>
<script>
document.getElementById('f').addEventListener('load',function(){
  setTimeout(function(){
    var d=document.getElementById('f').contentDocument, c=d.getElementById('yutBoard').getBoundingClientRect();
    d.body.setAttribute('data-size', Math.round(c.width)+'x'+Math.round(c.height));
    d.getElementById('turnTitle').textContent='🎉 승리!';
    d.getElementById('turnSub').textContent='청팀 (나)이 4말을 모두 완주하여 승리했습니다!';
    d.querySelector('#turnBanner').classList.add('is-win');
  },1500);
});
</script>
