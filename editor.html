      const hintText = document.getElementById('confirmHintText');

    // 현재 문제 교재로 확정 버튼
    function confirmCurrentProblem() {
      if (!problems || !problems[activeIndex]) return;
      saveActiveProblemSilent();
      const currentP = problems[activeIndex];
      const orderInput = document.getElementById('confirmOrderInput');
      const targetOrder = parseInt(orderInput.value, 10);
      if (isNaN(targetOrder) || targetOrder < 1) {
        alert('1 이상의 번호를 입력해주세요.');
        return;
      }

      // 기존 확정 여부 확인
      const existingIdx = confirmedProblems.findIndex(cp => cp.candidateId === currentP.id || (cp.data === currentP.data && cp.answer1 === currentP.answer1));

      const newItem = {
        order: targetOrder,
        candidateId: currentP.id,
        code: `t1_ch01_${String(targetOrder).padStart(2, '0')}`,
        data: currentP.data,
        answer1: currentP.answer1,
        question: currentP.question,
        hint: currentP.hint,
        speech: currentP.speech,
        start: currentP.start || 'BA',
        group: currentP.group,
        stoneDesc: currentP.stoneDesc,
        matchedSources: currentP.matchedSources || []
      };

      if (existingIdx >= 0) {
        // 이미 있던 문제의 번호/내용 수정
        confirmedProblems[existingIdx] = newItem;
      } else {
        // 동일 번호가 이미 존재하면 해당 번호 이상을 1씩 밀어줌
        confirmedProblems.forEach(cp => {
          if (cp.order >= targetOrder) cp.order += 1;
        });
        confirmedProblems.push(newItem);
      }

      // order 순 정렬
      confirmedProblems.sort((a, b) => a.order - b.order);

      saveConfirmedProblems();
      renderConfirmedList();
      renderCandidateList();
      updateConfirmBoxUI();
      playDingDong();

      // 다음 번호 자동 제안
      const maxOrder = confirmedProblems.reduce((m, item) => Math.max(m, item.order || 0), 0);
      if (orderInput) orderInput.value = maxOrder + 1;

      const badge = document.getElementById('autoSaveBadge');
      if (badge) {
        badge.textContent = `⭐ 교재 #${targetOrder}번 확정 완료!`;
        badge.style.opacity = '1';
      }
    }

    // 교재 확정 취소

      if (!problems || !problems[activeIndex]) return;
      const currentP = problems[activeIndex];
      const idx = confirmedProblems.findIndex(cp => cp.candidateId === currentP.id || (cp.data === currentP.data && cp.answer1 === currentP.answer1));
      if (idx >= 0) {
        confirmedProblems.splice(idx, 1);
        saveConfirmedProblems();
        renderConfirmedList();
        renderCandidateList();
        updateConfirmBoxUI();
      }
    }

    // 확정된 문제 편집기로 불러오기
    function selectConfirmedProblem(confIdx) {
      const cp = confirmedProblems[confIdx];
      if (!cp) return;
      let candIdx = problems.findIndex(p => p.id === cp.candidateId || (p.data === cp.data && p.answer1 === cp.answer1));
      if (candIdx >= 0) {
        selectProblem(candIdx);
      } else {
        saveActiveProblemSilent();
        currentGrid = parseSgfTo9x9(cp.data, cp.answer1);
        document.getElementById('editProblemCode').value = cp.code || `교재 #${cp.order}`;
        document.getElementById('editQuestion').value = cp.question || '';
        document.getElementById('editHint').value = cp.hint || '';
        document.getElementById('editSpeech').value = cp.speech || '';
        document.getElementById('editStartTurn').value = cp.start || 'BA';
        renderBoard();
        updateConfirmBoxUI();
      }
      document.querySelectorAll('.confirmed-card').forEach((el, i) => {
        el.classList.toggle('active', i === confIdx);
      });
    }

    // 우측 확정 문제 순서 이동
    function moveConfirmedUp(confIdx) {
      if (confIdx <= 0) return;
      const cur = confirmedProblems[confIdx];
      const prev = confirmedProblems[confIdx - 1];
      const tempOrder = cur.order;
      cur.order = prev.order;
      prev.order = tempOrder;
      confirmedProblems.sort((a, b) => a.order - b.order);
      saveConfirmedProblems();
      renderConfirmedList();
      renderCandidateList();
      updateConfirmBoxUI();
    }

    function moveConfirmedDown(confIdx) {
      if (confIdx >= confirmedProblems.length - 1) return;
      const cur = confirmedProblems[confIdx];
      const next = confirmedProblems[confIdx + 1];
      const tempOrder = cur.order;
      cur.order = next.order;
      next.order = tempOrder;
      confirmedProblems.sort((a, b) => a.order - b.order);
      saveConfirmedProblems();
      renderConfirmedList();
      renderCandidateList();
      updateConfirmBoxUI();
    }

    function deleteConfirmed(confIdx) {
      if (confirm(`제 ${confirmedProblems[confIdx].order}번 문제를 교재에서 제외하시겠습니까?`)) {
        confirmedProblems.splice(confIdx, 1);
        saveConfirmedProblems();
        renderConfirmedList();
        renderCandidateList();
        updateConfirmBoxUI();
      }
    }

    // 미니 바둑판 렌더러 (실제 교재 다이어그램 디자인)
    function drawMiniBoard(miniCanvas, grid) {
      const mCtx = miniCanvas.getContext('2d');
      const size = miniCanvas.width;
      const bSize = 9;
      const cSize = size / (bSize + 1);

      // 목재 바탕
      mCtx.fillStyle = '#f2d69f';
      mCtx.fillRect(0, 0, size, size);

      // 외곽 테두리
      mCtx.strokeStyle = '#3d2510';
      mCtx.lineWidth = 1.6;
      mCtx.strokeRect(cSize, cSize, cSize * (bSize - 1), cSize * (bSize - 1));

      // 격자선
      mCtx.strokeStyle = '#5a3d1c';
      mCtx.lineWidth = 0.9;
      for (let i = 0; i < bSize; i++) {
        const pos = cSize * (i + 1);
        mCtx.beginPath();
        mCtx.moveTo(cSize, pos);
        mCtx.lineTo(cSize * bSize, pos);
        mCtx.stroke();

        mCtx.beginPath();
        mCtx.moveTo(pos, cSize);
        mCtx.lineTo(pos, cSize * bSize);
        mCtx.stroke();
      }

      // 4선 화점 (5, 5)
      mCtx.fillStyle = '#3d2510';
      mCtx.beginPath();
      mCtx.arc(cSize * 5, cSize * 5, cSize * 0.14, 0, Math.PI * 2);
      mCtx.fill();

      // 돌 및 정답★
      const sRadius = cSize * 0.44;
      for (let y = 0; y < 9; y++) {
        for (let x = 0; x < 9; x++) {
          const val = grid[y][x];
          const px = cSize * (x + 1);
          const py = cSize * (y + 1);

          if (val === 1) { // 흑돌
            mCtx.save();
            mCtx.fillStyle = '#0f172a';
            mCtx.beginPath();
            mCtx.arc(px, py, sRadius, 0, Math.PI * 2);
            mCtx.fill();
            mCtx.strokeStyle = '#000000';
            mCtx.lineWidth = 0.5;
            mCtx.stroke();
            mCtx.restore();
          } else if (val === 2) { // 백돌
            mCtx.save();
            mCtx.fillStyle = '#ffffff';
            mCtx.beginPath();
            mCtx.arc(px, py, sRadius, 0, Math.PI * 2);
            mCtx.fill();
            mCtx.strokeStyle = '#94a3b8';
            mCtx.lineWidth = 0.8;
            mCtx.stroke();
            mCtx.restore();
          } else if (val === 3) { // 정답 착점★
            mCtx.save();
            mCtx.fillStyle = 'rgba(239, 68, 68, 0.25)';
            mCtx.beginPath();
            mCtx.arc(px, py, sRadius * 0.95, 0, Math.PI * 2);
            mCtx.fill();
            mCtx.strokeStyle = '#ef4444';
            mCtx.lineWidth = 1.3;
            mCtx.stroke();

            mCtx.fillStyle = '#ef4444';
            mCtx.font = `bold ${Math.floor(cSize * 0.75)}px sans-serif`;
            mCtx.textAlign = 'center';
            mCtx.textBaseline = 'middle';
            mCtx.fillText('★', px, py);
            mCtx.restore();
          }
        }
      }
    }

    let activeIndex = 0;
    let currentTool = 'black'; // 'black' | 'white' | 'answer' | 'eraser'
    const boardSize = 9;

    // 현재 편집 중인 문제의 바둑판 상태
    // 9x9 grid: 0 = 빈곳, 1 = 흑돌, 2 = 백돌, 3 = 정답(Answer)
    let currentGrid = Array(9).fill(null).map(() => Array(9).fill(0));

    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d');
    const displaySize = canvas.width;
    const cellSize = displaySize / (boardSize + 1);

    // SGF 좌표 -> 9x9 인덱스 (10~18 우하귀 기준 10 shift)
    function parseSgfTo9x9(sgfData, ansData) {
      const grid = Array(9).fill(null).map(() => Array(9).fill(0));
      if (!sgfData) return grid;

      const regex = /;([BW])\[([a-s]{2})\]/gi;
      let m;
      while ((m = regex.exec(sgfData)) !== null) {
        const color = m[1].toUpperCase() === 'B' ? 1 : 2;
        const x = m[2].charCodeAt(0) - 97 - 10;
        const y = m[2].charCodeAt(1) - 97 - 10;
        if (x >= 0 && x < 9 && y >= 0 && y < 9) {
          grid[y][x] = color;
        }
      }

      // 정답 위치 매핑
      if (ansData) {
        const aRegex = /;([BW])\[([a-s]{2})\]/gi;
        let am;
        while ((am = aRegex.exec(ansData)) !== null) {
          const ax = am[2].charCodeAt(0) - 97 - 10;
          const ay = am[2].charCodeAt(1) - 97 - 10;
          if (ax >= 0 && ax < 9 && ay >= 0 && ay < 9) {
            grid[ay][ax] = 3; // 정답 마커
          }
        }
      }

      return grid;
    }

    // 9x9 grid -> SGF 문자열 변환 (shift 10 역연산)
    function gridToSgf(grid) {
      let data = '';
      let answer1 = '';

      for (let y = 0; y < 9; y++) {
        for (let x = 0; x < 9; x++) {
          const val = grid[y][x];
          const sgfCoord = String.fromCharCode(97 + x + 10) + String.fromCharCode(97 + y + 10);
          if (val === 1) {
            data += `;B[${sgfCoord}]`;
          } else if (val === 2) {
            data += `;W[${sgfCoord}]`;
          } else if (val === 3) {
            // 정답 착점 (다중 정답 지원: 귀 2개, 변 3개, 중앙 4개 등)
            answer1 += `;B[${sgfCoord}]`;
          }
        }
      }
      return { data, answer1 };
    }

    // 좌측 후보 목록 렌더링
    function renderCandidateList() {
      const container = document.getElementById('candidateListContainer');
      container.innerHTML = '';
      
      const countEl = document.getElementById('countFilterAll');
      if (countEl) countEl.textContent = problems.length;
      const countBtnEl = document.getElementById('countFilterAllBtn');
      if (countBtnEl) countBtnEl.textContent = problems.length;

      const confirmedCount = problems.filter(p => confirmedProblems.some(cp => cp.candidateId === p.id || (cp.data === p.data && cp.answer1 === p.answer1))).length;
      const unconfirmedCount = problems.length - confirmedCount;
      const countConfEl = document.getElementById('countConfirmedFilter');
      if (countConfEl) countConfEl.textContent = confirmedCount;
      const countUnconfEl = document.getElementById('countUnconfirmedFilter');
      if (countUnconfEl) countUnconfEl.textContent = unconfirmedCount;

      const g1Count = problems.filter(p => p.group === 1 || p.blackCount === 0).length;
      const g2Count = problems.length - g1Count;
      const countPill = document.getElementById('candidateCountPill');
      if (countPill) countPill.textContent = `후보: ${problems.length}문제 (1그룹 ${g1Count}개 / 2그룹 ${g2Count}개)`;

      let renderedCount = 0;
      let lastGroupSeen = null;

      problems.forEach((p, idx) => {
        const isDup = p.matchedSources && p.matchedSources.length > 1;
        const isGroup1 = (p.group === 1 || p.blackCount === 0);
        const confirmedMatch = confirmedProblems.find(cp => cp.candidateId === p.id || (cp.data === p.data && cp.answer1 === p.answer1));
        const isConfirmed = !!confirmedMatch;

        let matchFilter = true;
        if (currentFilter === 'confirmed') {
          matchFilter = isConfirmed;
        } else if (currentFilter === 'unconfirmed') {
          matchFilter = !isConfirmed;
        } else if (currentFilter === 'group1') {
          matchFilter = isGroup1;
        } else if (currentFilter === 'group2') {
          matchFilter = !isGroup1;
        } else if (currentFilter === '씽크탱크') {
          matchFilter = (p.primaryBook === '씽크탱크' || (p.matchedSources && p.matchedSources.some(s => s.includes('씽크탱크'))));
        } else if (currentFilter === '논리바둑') {
          matchFilter = (p.primaryBook === '논리바둑' || (p.matchedSources && p.matchedSources.some(s => s.includes('논리바둑'))));
        } else if (currentFilter === '알파바둑') {
          matchFilter = (p.primaryBook === '알파바둑' || (p.matchedSources && p.matchedSources.some(s => s.includes('알파바둑'))));
        } else if (currentFilter === '파워씽크') {
          matchFilter = (p.primaryBook === '파워씽크' || (p.matchedSources && p.matchedSources.some(s => s.includes('파워씽크'))));
        } else if (currentFilter === 'dup') {
          matchFilter = isDup;
        }

        if (!matchFilter) return;
        renderedCount++;

        // 전체 필터일 때 그룹 구분선 추가
        if (currentFilter === 'all') {
          const currentGroup = isGroup1 ? 1 : 2;
          if (currentGroup !== lastGroupSeen) {
            const header = document.createElement('div');
            header.className = 'group-section-header' + (currentGroup === 2 ? ' group2' : '');
            header.innerHTML = (currentGroup === 1)
              ? `<span>⚪ [제1그룹] 백돌만 있는 기초 활로 문제 (${g1Count}개)</span>`
              : `<span>⚫ [제2그룹] 흑돌 외 나머지 활로를 막는 문제 (${g2Count}개)</span>`;
            container.appendChild(header);
            lastGroupSeen = currentGroup;
          }
        }

        const card = document.createElement('div');
        card.className = 'candidate-card' + (idx === activeIndex ? ' active' : '');
        card.setAttribute('data-index', idx);
        card.draggable = true;

        // 드래그 앤 드롭 순서 변경 이벤트
        card.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', idx);
        });
        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          card.classList.add('drag-over');
        });
        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over');
        });
        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('drag-over');
          const fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
          const toIdx = idx;
          if (!isNaN(fromIdx) && fromIdx !== toIdx) {
            saveActiveProblemSilent();
            isReordering = true;
            const [moved] = problems.splice(fromIdx, 1);
            problems.splice(toIdx, 0, moved);
            activeIndex = toIdx;
            reindexProblems();
            renderCandidateList();
            loadProblemToUI(toIdx);
            isReordering = false;
          }
        });

        const confirmedTag = isConfirmed
          ? `<span class="confirmed-tag">👑 교재 #${confirmedMatch.order}번</span>`
          : '';

        const groupTag = isGroup1
          ? '<span class="source-tag tag-group1">⚪ 백돌 단독</span>'
          : `<span class="source-tag tag-group2">⚫ 흑돌 ${p.blackCount || 1}점 놓임</span>`;
        
        const tagsHtml = (p.matchedSources || []).map(s => {
          let cls = 'tag-think';
          if (s.includes('논리바둑')) cls = 'tag-logic';
          else if (s.includes('알파바둑')) cls = 'tag-alpha';
          else if (s.includes('파워씽크')) cls = 'tag-power';
          if (s.includes('(동일)')) cls += ' tag-dup';
          return `<span class="source-tag ${cls}">${s}</span>`;
        }).join('');

        card.innerHTML = `
          <div class="card-top">
            <span class="card-num">#${idx + 1}</span>
            <div class="card-badge-row">${confirmedTag}${groupTag}${tagsHtml}</div>
          </div>
          <div class="card-q-preview">${p.question || '활로 문제'}</div>
        `;

        card.addEventListener('click', () => {
          selectProblem(idx);
        });

        container.appendChild(card);
      });
    }

    // 문제 순서 재정렬 번호 동기화
    function reindexProblems() {
      problems.forEach((p, i) => {
        p.id = i + 1;
        p.code = 'hwalro_' + String(i + 1).padStart(2, '0');
      });
      persistDraft();
    }

    // UI에 문제 데이터 로드 (저장을 절대 트리거하지 않는 순수 로더)
    function loadProblemToUI(idx) {
      const p = problems[idx];
      if (!p) return;

      currentGrid = parseSgfTo9x9(p.data, p.answer1);
      document.getElementById('editProblemCode').value = p.code || `#${idx + 1}`;
      document.getElementById('editQuestion').value = p.question || '';
      document.getElementById('editHint').value = p.hint || '';
      document.getElementById('editSpeech').value = p.speech || '';
      document.getElementById('editStartTurn').value = p.start || 'BA';
      document.getElementById('sourceListText').textContent = (p.matchedSources || []).join(' | ');

      const posEl = document.getElementById('currentProblemPos');
      if (posEl) posEl.textContent = `현재 #${idx + 1}번 / ${problems.length}문제`;
      const targetInput = document.getElementById('targetOrderInput');
      if (targetInput) targetInput.value = idx + 1;

      renderBoard();
      updateActiveCardHighlight();
      updateConfirmBoxUI();
    }

    function updateActiveCardHighlight() {
      document.querySelectorAll('.candidate-card').forEach((el) => {
        el.classList.toggle('active', parseInt(el.getAttribute('data-index')) === activeIndex);
      });
    }

    // 문제 순서 위로 이동
    function moveProblemUp() {
      if (activeIndex <= 0) return;
      saveActiveProblemSilent();
      isReordering = true;
      const toIdx = activeIndex - 1;
      const [moved] = problems.splice(activeIndex, 1);
      problems.splice(toIdx, 0, moved);
      activeIndex = toIdx;
      reindexProblems();
      renderCandidateList();
      loadProblemToUI(toIdx);
      isReordering = false;
    }

    // 문제 순서 아래로 이동
    function moveProblemDown() {
      if (activeIndex >= problems.length - 1) return;
      saveActiveProblemSilent();
      isReordering = true;
      const toIdx = activeIndex + 1;
      const [moved] = problems.splice(activeIndex, 1);
      problems.splice(toIdx, 0, moved);
      activeIndex = toIdx;
      reindexProblems();
      renderCandidateList();
      loadProblemToUI(toIdx);
      isReordering = false;
    }

    // 문제 순서 목표 번호 직접 지정 이동
    function moveProblemToTarget() {
      const targetVal = parseInt(document.getElementById('targetOrderInput').value, 10);
      if (isNaN(targetVal) || targetVal < 1 || targetVal > problems.length) {
        alert(`1번부터 ${problems.length}번 사이의 번호를 입력해주세요.`);
        return;
      }
      const toIdx = targetVal - 1;
      if (toIdx === activeIndex) return;

      // 1. 현재 문제의 수정사항을 이동 전에 확실하게 먼저 저장!
      saveActiveProblemSilent();

      // 2. 재배치 플래그 가동 (다른 이벤트의 오염 차단)
      isReordering = true;

      // 3. 배열 이동
      const [moved] = problems.splice(activeIndex, 1);
      problems.splice(toIdx, 0, moved);

      // 4. activeIndex를 이동된 위치(toIdx)로 즉시 갱신!
      activeIndex = toIdx;

      // 5. 전체 번호 동기화 및 렌더링
      reindexProblems();
      renderCandidateList();
      loadProblemToUI(toIdx);

      isReordering = false;
    }

    // 문제 선택
    function selectProblem(idx) {
      if (idx < 0 || idx >= problems.length) return;
      if (!isReordering && idx !== activeIndex && problems[activeIndex] && currentGrid) {
        saveActiveProblemSilent();
      }
      activeIndex = idx;
      loadProblemToUI(idx);
    }

    // 툴 선택
    function setEditorTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tool === tool);
      });
    }

    // 캔버스 클릭 이벤트 바인딩
    function bindCanvasEvents() {
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX - rect.left;
        const clientY = e.clientY - rect.top;

        // 최근접 교차점 (0~8) 계산
        const col = Math.round((clientX - cellSize) / cellSize);
        const row = Math.round((clientY - cellSize) / cellSize);

        if (col >= 0 && col < 9 && row >= 0 && row < 9) {
          handleBoardClick(col, row);
        }
      });

      // 우측 입력폼 실시간 자동 저장 바인딩
      ['editQuestion', 'editHint', 'editSpeech', 'editStartTurn'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('input', saveActiveProblemSilent);
          el.addEventListener('change', saveActiveProblemSilent);
        }
      });
    }

    // 착수 또는 편집 처리
    function handleBoardClick(x, y) {
      if (currentTool === 'black') {
        currentGrid[y][x] = (currentGrid[y][x] === 1) ? 0 : 1;
        playStoneSound();
      } else if (currentTool === 'white') {
        currentGrid[y][x] = (currentGrid[y][x] === 2) ? 0 : 2;
        playStoneSound();
      } else if (currentTool === 'answer') {
        // 다중 정답 별(★) 토글 지원: 이미 별이면 삭제, 아니면 별 추가 (활로 2~4개 모두 지정 가능)
        if (currentGrid[y][x] === 3) {
          currentGrid[y][x] = 0;
        } else {
          currentGrid[y][x] = 3;
          playDingDong();
        }
      } else if (currentTool === 'eraser') {
        currentGrid[y][x] = 0;
      }
      renderBoard();
      saveActiveProblemSilent();
    }

    function clearCurrentBoard() {
      if (confirm('현재 바둑판의 모든 돌과 정답을 비우시겠습니까?')) {
        currentGrid = Array(9).fill(null).map(() => Array(9).fill(0));
        renderBoard();
        saveActiveProblemSilent();
      }
    }

    function playStoneSound() {
      if (window.badukAudio && window.badukAudio.playStone) window.badukAudio.playStone();
    }
    function playDingDong() {
      if (window.badukAudio && window.badukAudio.playDingDong) window.badukAudio.playDingDong();
    }

    // 바둑판 렌더링
    function renderBoard() {
      ctx.clearRect(0, 0, displaySize, displaySize);

      // 1. 목재 바탕
      ctx.fillStyle = '#f2d69f';
      ctx.fillRect(0, 0, displaySize, displaySize);

      // 2. 외곽 테두리
      ctx.strokeStyle = '#3d2510';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(cellSize, cellSize, cellSize * (boardSize - 1), cellSize * (boardSize - 1));

      // 3. 격자선
      ctx.strokeStyle = '#2d1d0c';
      ctx.lineWidth = 1.3;
      for (let i = 0; i < boardSize; i++) {
        const pos = cellSize * (i + 1);
        ctx.beginPath();
        ctx.moveTo(cellSize, pos);
        ctx.lineTo(cellSize * boardSize, pos);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(pos, cellSize);
        ctx.lineTo(pos, cellSize * boardSize);
        ctx.stroke();
      }

      // 4. 🌟 [원장님 원칙] 4선 화점: 오직 1개 (5, 5)만 렌더링!
      const starRadius = cellSize * 0.12;
      const starX = cellSize * (5 + 1);
      const starY = cellSize * (5 + 1);
      ctx.fillStyle = '#5a3d1c';
      ctx.beginPath();
      ctx.arc(starX, starY, starRadius, 0, Math.PI * 2);
      ctx.fill();

      // 5. 돌 및 정답 마커 렌더링
      const stoneRadius = cellSize * 0.44;
      for (let y = 0; y < 9; y++) {
        for (let x = 0; x < 9; x++) {
          const val = currentGrid[y][x];
          const px = cellSize * (x + 1);
          const py = cellSize * (y + 1);

          if (val === 1) {
            // 흑돌
            drawStone(px, py, stoneRadius, 1);
          } else if (val === 2) {
            // 백돌
            drawStone(px, py, stoneRadius, 2);
          } else if (val === 3) {
            // ⭐ 정답 착점 마커
            ctx.fillStyle = 'rgba(239, 68, 68, 0.25)';
            ctx.beginPath();
            ctx.arc(px, py, stoneRadius * 0.95, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = '#ef4444';
            ctx.font = `bold ${Math.floor(cellSize * 0.55)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('★', px, py);
          }
        }
      }
    }

    // 사실적인 바둑돌 렌더링
    function drawStone(x, y, radius, color) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      
      const grad = ctx.createRadialGradient(
        x - radius * 0.3, y - radius * 0.3, radius * 0.1,
        x, y, radius
      );

      if (color === 1) { // 흑돌
        grad.addColorStop(0, '#475569');
        grad.addColorStop(0.5, '#0f172a');
        grad.addColorStop(1, '#020617');
      } else { // 백돌
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.7, '#f1f5f9');
        grad.addColorStop(1, '#cbd5e1');
      }

      ctx.fillStyle = grad;
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetX = 1.5;
      ctx.shadowOffsetY = 2;
      ctx.fill();
      ctx.restore();
    }

    // 수정 내용 수동 저장 버튼
    function saveCurrentProblemEdits() {
      saveActiveProblemSilent();
      renderCandidateList();
      alert(`✅ #${activeIndex + 1}번 문제의 수정 내용이 안전하게 저장되었습니다!`);
    }

    // 문제 삭제/제외
    function deleteCurrentProblem() {
      if (confirm(`정말 #${activeIndex + 1}번 문제를 목록에서 제외하시겠습니까?`)) {
        problems.splice(activeIndex, 1);
        reindexProblems();
        if (activeIndex >= problems.length) activeIndex = Math.max(0, problems.length - 1);
        renderCandidateList();
        if (problems.length > 0) selectProblem(activeIndex);
        else clearCurrentBoard();
      }
    }

    // 신규 빈 문제 추가
    function addNewEmptyProblem() {
      const newNum = problems.length + 1;
      const newP = {
        id: newNum,
        code: 'hwalro_' + String(newNum).padStart(2, '0'),
        type: '1',
        question: '백의 활로(살아가는 길)를 모두 막아 보세요.',
        hint: '활로는 상·하·좌·우 직선으로 이어집니다.',
        speech: '원장님 추천 오리지널 활로 문제!',
        data: ';W[pp];B[qp];B[pq];B[op]',
        answer1: ';B[po]',
        matchedSources: ['원장님 직접 창작'],
        isSelected: true
      };
      problems.push(newP);
      renderCandidateList();
      selectProblem(problems.length - 1);
    }

    // 최종 단원 내보내기 및 정규 코스 적용
    function exportCuratedUnit() {
      saveActiveProblemSilent();
      const listToSave = (confirmedProblems && confirmedProblems.length > 0) ? confirmedProblems : problems;
      const isConfirmedList = (confirmedProblems && confirmedProblems.length > 0);

      const unitData = {
        title: '제1단원: 돌의 활로 (숨구멍 찾기)',
        count: listToSave.length,
        problems: listToSave.map((p, idx) => ({
          code: `t1_ch01_${String(idx + 1).padStart(2, '0')}`,
          type: '1',
          question: p.question,
          hint: p.hint,
          speech: p.speech,
          data: p.data,
          answer1: p.answer1,
          size: '9',
          start: p.start || 'BA',
          matchedSources: p.matchedSources || []
        }))
      };

      // localStorage에 확정 저장 (수업 화면과 100% 동기화)
      if (isConfirmedList) {
        saveConfirmedProblems();
      } else {
        localStorage.setItem('jh_curated_unit_1', JSON.stringify(unitData));
      }

      // 소장 및 백업용 JSON 파일 다운로드
      const blob = new Blob([JSON.stringify(unitData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `unit_1_hwalro_curated_${listToSave.length}problems.json`;
      a.click();
      URL.revokeObjectURL(url);

      alert(`🎉 원장님께서 완성하신 [제1단원: 돌의 활로] 총 ${listToSave.length}문제가 브라우저에 안전하게 저장되었으며, 학생 수업 화면에 즉시 적용되었습니다!\n(소장 및 백업용 파일도 함께 다운로드되었습니다.)`);
    }

    window.onload = init;
  </script>
