<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바둑스쿨 · 아이들의 바둑 놀이터 | JH 바둑스쿨</title>
<link rel="stylesheet" href="style.css?v=1">
<link rel="icon" href="images/favicon.ico">
<script src="site_lock.js?v=9" defer></script>
</head>
<body>

<!-- ===== 상단 바 ===== -->
<header class="topbar">
  <a class="brand" href="#" data-go="home">
    <img src="images/baduk_logo_final.png" alt="바둑스쿨">
  </a>
  <nav class="menu">
    <button data-go="learn">바둑 학습</button>
    <button data-go="play">대국</button>
    <button data-go="omok">오목</button>
    <button data-go="alkkagi">알까기</button>
  </nav>
</header>

<!-- ===== 홈 ===== -->
<section class="view" id="view-home">
  <div class="hero">
    <img class="hero__img" src="images/hero_cut_nobtn.webp" alt="">
    <div class="hero__cta">
      <button class="cta cta--play" data-go="play">▶ 바둑 시작하기</button>
      <button class="cta cta--learn" data-go="learn">▣ 바둑 배우기</button>
    </div>
  </div>

  <ul class="stats">
    <li><img src="images/stat_1.png" alt=""><span>행복한 아이들</span></li>
    <li><img src="images/stat_2.png" alt=""><span>체계적인 바둑 강의</span></li>
    <li><img src="images/stat_3.png" alt=""><span>종합적 사고력 향상</span></li>
    <li><img src="images/stat_4.png" alt=""><span>건전한 바둑·오목·알까기</span></li>
    <li><img src="images/stat_5.png" alt=""><span>한자·격언·인성 함양</span></li>
  </ul>
</section>

<!-- ===== 학습 ===== -->
<section class="view" id="view-learn" hidden>
  <div class="panel-side">
    <h2>교재</h2>
    <div id="bookList" class="book-list"></div>
  </div>
  <div class="panel-main">
    <div class="main-head">
      <span id="probTitle">단원을 선택하세요</span>
      <span class="spacer"></span>
      <button id="btnPrev">이전</button>
      <button id="btnNext">다음</button>
    </div>
    <div class="board-wrap"><canvas id="board"></canvas></div>
    <p id="probDesc" class="desc"></p>
  </div>
</section>

<!-- ===== 대국 / 오목 / 알까기 (다음 단계) ===== -->
<section class="view" id="view-play" hidden><div class="soon">대국 화면 준비 중</div></section>
<section class="view" id="view-omok" hidden><div class="soon">오목 화면 준비 중</div></section>
<section class="view" id="view-alkkagi" hidden><div class="soon">알까기 화면 준비 중</div></section>

<script src="app_v2.js?v=1"></script>
</body>
</html>
