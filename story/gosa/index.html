<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>종이 극장 쇼츠: 우공이산 — JH 바둑스쿨 Story</title>
  <meta name="description" content="그림을 가리지 않고 감상하는 48초 6겹 한지 종이 극장 - 우공이산(愚公移山)">
  <link rel="stylesheet" href="/unified-nav.css?v=20261103-nav-v11">
  <link rel="stylesheet" href="style.css?v=20261112-v5">
  <script src="/unified-nav.js?v=20261103-nav-v11" defer></script>
</head>
<body data-bks-page="story-gosa">
  <main class="pt-wrap">
    <header class="pt-header">
      <div class="pt-badge-row">
        <span class="pt-badge">🎬 종이 극장 이야기</span>
        <span class="pt-act-pill" id="timePill">00:00 / 00:48</span>
      </div>
      <h1 class="pt-title">우공이산 <span class="pt-hanja">(愚公移山)</span></h1>
    </header>

    <!-- 100% Unobstructed Multi-Layer Paper Diorama Stage -->
    <section class="pt-stage" id="paperStage" aria-label="종이 극장 무대">
      <div class="pt-depth-layer layer-sky" id="layerSky">
        <img src="assets/layer_sky.jpg" alt="하늘과 먼 산 배경" class="layer-img">
      </div>

      <div class="pt-depth-layer layer-mist-back" id="layerMist">
        <div class="mist-band band-1"></div>
        <div class="mist-band band-2"></div>
      </div>

      <div class="pt-depth-layer layer-mountains" id="layerMountains">
        <img src="assets/layer_mountains.png" alt="거대한 두 산 종이 레이어" class="layer-img">
      </div>

      <div class="pt-depth-layer layer-village" id="layerVillage">
        <img src="assets/layer_village.png" alt="한옥 마을과 우공 할아버지" class="layer-img">
      </div>

      <div class="pt-depth-layer layer-particles" id="particlesLayer" aria-hidden="true">
        <span class="pt-mote m1"></span>
        <span class="pt-mote m2"></span>
        <span class="pt-mote m3"></span>
        <span class="pt-mote m4"></span>
        <span class="pt-mote m5"></span>
        <span class="pt-mote m6"></span>
        <span class="pt-mote m7"></span>
        <span class="pt-mote m8"></span>
      </div>

      <div class="pt-depth-layer layer-pines" id="layerPines">
        <img src="assets/layer_pines.png" alt="앞쪽 소나무와 바위 프레임" class="layer-img">
      </div>

      <div class="pt-depth-layer layer-curtains">
        <div class="curtain-left"></div>
        <div class="curtain-right"></div>
        <div class="stage-valance"></div>
      </div>
    </section>

    <!-- Dedicated Cinema Controls & Narration Panel BELOW the Stage (Zero overlap!) -->
    <section class="pt-player-panel" aria-label="이야기 자막 및 재생 컨트롤">
      <div class="pt-player-top">
        <span class="stage-chapter" id="stageChapter">제1장 · 길을 막은 두 산</span>
        <div class="pt-player-btns">
          <button type="button" id="btnPlayPause" class="shorts-ctrl-btn">⏸️ 일시정지</button>
          <button type="button" id="btnReplay" class="shorts-ctrl-btn">🔄 처음부터</button>
        </div>
      </div>

      <div class="shorts-progress-track" id="progressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="shorts-progress-fill" id="progressFill"></div>
      </div>

      <p class="shorts-subtitle" id="shortsSubtitle">
        옛날 중국 북산에 아흔 살이 된 ‘우공’ 할아버지가 살았어요. 집 바로 앞을 거대한 두 산이 가로막고 있어 늘 멀리 돌아가야 했지요.
      </p>
    </section>

    <!-- Hanja Breakdown + Baduk Wisdom + Quick Quiz -->
    <section class="pt-story-card">
      <div class="pt-study-box">
        <div class="pt-hanja-grid">
          <div class="hanja-chip"><strong>愚</strong><span>어리석을 우</span></div>
          <div class="hanja-chip"><strong>公</strong><span>공 공 (할아버지)</span></div>
          <div class="hanja-chip"><strong>移</strong><span>옮길 이</span></div>
          <div class="hanja-chip"><strong>山</strong><span>뫼 산</span></div>
        </div>
        <div class="pt-baduk-tip">
          <strong>⚫ 바둑 속 지혜:</strong> 처음엔 바둑판이 넓고 불리해 보여도, 포기하지 않고 한 수 한 수 정성을 다해 두면 결국 승리의 길을 열 수 있어요!
        </div>
        <div class="pt-mini-quiz" id="miniQuiz">
          <p class="quiz-q">💡 <b>확인 퀴즈:</b> ‘우공이산’이 가르쳐 주는 가장 중요한 마음가짐은 무엇일까요?</p>
          <div class="quiz-opts">
            <button type="button" class="quiz-opt" data-ok="false">어려우면 빨리 포기하기</button>
            <button type="button" class="quiz-opt" data-ok="true">끈기 있게 꾸준히 노력하기</button>
            <button type="button" class="quiz-opt" data-ok="false">남에게 전부 미루기</button>
          </div>
          <p class="quiz-result" id="quizResult" hidden></p>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js?v=20261112-v5"></script>
</body>
</html>
